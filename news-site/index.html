<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>オセロ界タイムズ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #FFFBF4; --card: #FFFFFF; --text-main: #3A332E; --text-dim: #8C8378;
    --accent: #D9704F; --accent-dark: #B8573A;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text-main);
    font-family: 'Noto Sans JP', sans-serif; min-height: 100vh;
  }
  a { color: var(--accent); text-decoration: none; }
  a:hover { color: var(--accent-dark); text-decoration: underline; }
  h1, h2, h3, .brand { font-family: 'Zen Maru Gothic', sans-serif; }

  .page { width: 100%; max-width: 720px; margin: 0 auto; padding: 24px 18px 80px; }

  header {
    display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between;
    gap: 12px; margin-bottom: 26px;
  }
  .brand-link { text-decoration: none; }
  .brand { font-size: 1.4rem; font-weight: 900; color: var(--accent); cursor: pointer; }
  .tagline { font-size: 0.74rem; color: var(--text-dim); margin-top: 2px; }
  nav { display: flex; gap: 14px; font-size: 0.8rem; font-weight: 700; flex-wrap: wrap; }

  .card {
    background: var(--card); border-radius: 18px; padding: 18px;
    margin-bottom: 16px; box-shadow: 0 2px 10px rgba(58,51,46,0.07);
    display: flex; gap: 14px; cursor: pointer;
  }
  .card:hover { box-shadow: 0 3px 14px rgba(58,51,46,0.12); }
  .avatar {
    flex: 0 0 auto; width: 48px; height: 48px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 1rem; font-family: 'Zen Maru Gothic', sans-serif;
  }
  .card-body { flex: 1; min-width: 0; }
  .card-meta { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 6px; }
  .tag {
    font-size: 0.66rem; font-weight: 700; padding: 3px 10px; border-radius: 10px;
    white-space: nowrap;
  }
  .card-time { color: var(--text-dim); font-size: 0.7rem; }
  .card-title { font-size: 1rem; margin: 0 0 6px; line-height: 1.4; }
  .card-summary { font-size: 0.82rem; color: #5B5349; line-height: 1.6; margin: 0; }

  .article-header { margin-bottom: 18px; }
  .back-link { font-size: 0.8rem; font-weight: 700; display: inline-block; margin-bottom: 14px; }
  .article-title { font-size: 1.3rem; margin: 10px 0; line-height: 1.4; }
  .article-body { font-size: 0.92rem; line-height: 1.9; white-space: pre-line; }

  .empty { color: var(--text-dim); font-size: 0.85rem; padding: 30px 0; text-align: center; }
  .footer-note {
    margin-top: 30px; padding-top: 16px; border-top: 1px solid #EEE6DB;
    font-size: 0.7rem; color: var(--text-dim); line-height: 1.7;
  }
</style>
</head>
<body>
<div class="page">
  <header>
    <div>
      <a class="brand-link" href="#" onclick="navigateTo('');return false;">
        <div class="brand">オセロ界タイムズ</div>
      </a>
      <div class="tagline">CIRCUIT OTHELLO LEAGUEの非公式ファンメディア（これは架空のリーグです）</div>
    </div>
    <nav>
      <a href="https://lab.spia-net.com/othello-league/" target="_blank" rel="noopener">結果サイトへ</a>
    </nav>
  </header>
  <div id="content"><div class="empty">読み込み中…</div></div>
  <div class="footer-note">
    「オセロ界タイムズ」は架空のオセロリーグ（CIRCUIT OTHELLO LEAGUE）を題材にした、ファンによる非公式のニュースメディアです。登場する個体・対局結果はすべて自動対局シミュレーションによるものであり、実在の人物・団体とは関係ありません。
  </div>
</div>

<script>
const TAG_COLORS = {
  '速報': { bg: '#EAF4FC', fg: '#2D6FA6' },
  '結果': { bg: '#F1EBFB', fg: '#6B4FA0' },
  '展望': { bg: '#FDEFF5', fg: '#B84C78' },
  '挑戦者決定': { bg: '#E9F7EE', fg: '#2F7A52' },
  '深掘り': { bg: '#FFF1E6', fg: '#B8692E' },
  '青龍': { bg: '#EAF4FC', fg: '#2D6FA6' },
  '朱雀': { bg: '#FDEFF5', fg: '#B84C78' },
  '白虎': { bg: '#F1EBFB', fg: '#6B4FA0' },
  '玄武': { bg: '#FFF1E6', fg: '#B8692E' },
};
const AVATAR_PALETTE = [
  { bg: '#E6F0FA', fg: '#2D6FA6' }, { bg: '#FDEFF5', fg: '#B84C78' },
  { bg: '#F1EBFB', fg: '#6B4FA0' }, { bg: '#FFF1E6', fg: '#B8692E' },
  { bg: '#E9F7EE', fg: '#2F7A52' },
];

let _articles = null;

function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
}

function hashString(s) {
  let h = 0;
  for (let i = 0; i < s.length; i++) { h = (h * 31 + s.charCodeAt(i)) >>> 0; }
  return h;
}

function avatarFor(name, seed) {
  const palette = AVATAR_PALETTE[hashString(seed || name || '?') % AVATAR_PALETTE.length];
  const initial = (name || '?').charAt(0);
  return `<div class="avatar" style="background:${palette.bg}; color:${palette.fg};">${escapeHtml(initial)}</div>`;
}

function tagChip(tag) {
  const c = TAG_COLORS[tag] || { bg: '#F1EBFB', fg: '#6B4FA0' };
  return `<span class="tag" style="background:${c.bg}; color:${c.fg};">${escapeHtml(tag)}</span>`;
}

function timeAgo(iso) {
  const diffMs = Date.now() - new Date(iso).getTime();
  const h = Math.floor(diffMs / 3600000);
  if (h < 1) return 'たった今';
  if (h < 24) return `${h}時間前`;
  const d = Math.floor(h / 24);
  if (d < 7) return `${d}日前`;
  return new Date(iso).toLocaleDateString('ja-JP');
}

async function loadArticles() {
  if (_articles) return _articles;
  const res = await fetch('./articles.json', { cache: 'no-store' });
  const data = await res.json();
  _articles = data.slice().sort((a, b) => new Date(b.published_at) - new Date(a.published_at));
  return _articles;
}

function primaryTag(article) {
  return (article.tags && article.tags[0]) || '';
}

function primaryName(article) {
  return article.related_individual_names && article.related_individual_names[0]
    || (article.related_individual_ids && article.related_individual_ids[0]) || '?';
}

async function renderFeed() {
  const el = document.getElementById('content');
  const articles = await loadArticles();
  if (articles.length === 0) {
    el.innerHTML = '<div class="empty">まだ記事がありません</div>';
    return;
  }
  el.innerHTML = articles.map(a => `
    <article class="card" onclick="navigateTo('article/${encodeURIComponent(a.id)}')">
      ${avatarFor(primaryName(a), a.related_individual_ids && a.related_individual_ids[0])}
      <div class="card-body">
        <div class="card-meta">
          ${(a.tags || []).slice(0, 1).map(tagChip).join('')}
          <span class="card-time">${timeAgo(a.published_at)}</span>
        </div>
        <h2 class="card-title">${escapeHtml(a.title)}</h2>
        <p class="card-summary">${escapeHtml(a.summary)}</p>
      </div>
    </article>
  `).join('');
}

async function renderArticle(id) {
  const el = document.getElementById('content');
  const articles = await loadArticles();
  const a = articles.find(x => x.id === id);
  if (!a) {
    el.innerHTML = '<div class="empty">記事が見つかりませんでした</div><a class="back-link" href="#" onclick="navigateTo(\'\');return false;">← フィードへ戻る</a>';
    return;
  }
  el.innerHTML = `
    <a class="back-link" href="#" onclick="navigateTo('');return false;">← フィードへ戻る</a>
    <div class="article-header">
      <div class="card-meta">${(a.tags || []).map(tagChip).join('')}<span class="card-time">${timeAgo(a.published_at)}</span></div>
      <h1 class="article-title">${escapeHtml(a.title)}</h1>
    </div>
    <div class="article-body">${escapeHtml(a.body)}</div>
  `;
}

function navigateTo(path) {
  location.hash = path ? `#${path}` : '';
}

function route() {
  const hash = location.hash.replace(/^#/, '');
  if (hash.startsWith('article/')) {
    renderArticle(decodeURIComponent(hash.slice('article/'.length)));
  } else {
    renderFeed();
  }
}

window.addEventListener('hashchange', route);
route();
</script>
</body>
</html>
