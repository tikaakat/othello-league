<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>オセロ界タイムズ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #FFFBF4; --card: #FFFFFF; --text-main: #3A332E; --text-dim: #8C8378;
    --accent: #D9704F; --accent-dark: #B8573A; --border: #EEE6DB;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text-main);
    font-family: 'Noto Sans JP', sans-serif; min-height: 100vh;
  }
  a { color: var(--accent); text-decoration: none; }
  a:hover { color: var(--accent-dark); text-decoration: underline; }
  h1, h2, h3, .brand { font-family: 'Zen Maru Gothic', sans-serif; }

  .page { width: 100%; max-width: 720px; margin: 0 auto; padding: 24px 18px 80px; }

  header {
    display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between;
    gap: 12px; margin-bottom: 18px;
  }
  .brand-link { text-decoration: none; }
  .brand { font-size: 1.4rem; font-weight: 900; color: var(--accent); cursor: pointer; }
  .tagline { font-size: 0.74rem; color: var(--text-dim); margin-top: 2px; }
  nav { display: flex; gap: 14px; font-size: 0.8rem; font-weight: 700; flex-wrap: wrap; align-items: center; }
  nav a.nav-tab { color: var(--text-dim); padding-bottom: 2px; border-bottom: 2px solid transparent; }
  nav a.nav-tab.active { color: var(--accent); border-bottom-color: var(--accent); }
  nav a.nav-external { color: var(--text-dim); font-weight: 500; }

  .holders-card {
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px;
    background: var(--card); border-radius: 16px; padding: 12px 10px;
    margin-bottom: 18px; box-shadow: 0 2px 10px rgba(58,51,46,0.07);
  }
  .holder-slot { text-align: center; cursor: pointer; padding: 4px 2px; border-radius: 10px; }
  .holder-slot:hover { background: #FFF6EE; }
  .holder-title { font-size: 0.66rem; font-weight: 700; color: var(--text-dim); margin-bottom: 3px; }
  .holder-name { font-size: 0.78rem; font-weight: 700; color: var(--text-main); line-height: 1.3; word-break: break-word; }
  .holders-season { font-size: 0.68rem; color: var(--text-dim); text-align: center; margin: -8px 0 16px; }

  .chip-row { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 14px; }
  .chip-btn {
    font-size: 0.72rem; font-weight: 700; padding: 5px 12px; border-radius: 12px;
    background: var(--card); color: var(--text-dim); border: 1px solid var(--border); cursor: pointer;
  }
  .chip-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }

  .filter-banner {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    background: #FFF6EE; border: 1px solid #F3DCC9; border-radius: 12px;
    padding: 8px 14px; margin-bottom: 14px; font-size: 0.78rem; color: var(--accent-dark);
  }
  .filter-banner button {
    font-size: 0.72rem; font-weight: 700; color: var(--text-dim); background: none;
    border: 1px solid var(--border); border-radius: 10px; padding: 3px 10px; cursor: pointer;
  }

  .card {
    background: var(--card); border-radius: 18px; padding: 18px;
    margin-bottom: 16px; box-shadow: 0 2px 10px rgba(58,51,46,0.07);
    display: flex; gap: 14px; cursor: pointer;
  }
  .card:hover { box-shadow: 0 3px 14px rgba(58,51,46,0.12); }
  .avatar {
    flex: 0 0 auto; width: 48px; height: 48px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 1rem; font-family: 'Zen Maru Gothic', sans-serif;
  }
  .card-body { flex: 1; min-width: 0; }
  .card-meta { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 6px; }
  .tag {
    font-size: 0.66rem; font-weight: 700; padding: 3px 10px; border-radius: 10px;
    white-space: nowrap; cursor: pointer;
  }
  .card-time { color: var(--text-dim); font-size: 0.7rem; }
  .byline { color: var(--text-dim); font-size: 0.7rem; }
  .byline b { color: var(--accent-dark); font-weight: 700; }
  .card-title { font-size: 1rem; margin: 0 0 6px; line-height: 1.4; }
  .card-summary { font-size: 0.82rem; color: #5B5349; line-height: 1.6; margin: 0 0 6px; }
  .card-individuals { display: flex; gap: 6px; flex-wrap: wrap; }
  .ind-chip {
    font-size: 0.68rem; color: var(--accent-dark); background: #FFF6EE; border-radius: 8px;
    padding: 2px 8px; cursor: pointer;
  }
  .ind-chip:hover { text-decoration: underline; }

  .article-header { margin-bottom: 18px; }
  .back-link { font-size: 0.8rem; font-weight: 700; display: inline-block; margin-bottom: 14px; }
  .article-title { font-size: 1.3rem; margin: 10px 0; line-height: 1.4; }
  .article-body { font-size: 0.92rem; line-height: 1.9; white-space: pre-line; }
  .related-box {
    margin-top: 22px; padding-top: 16px; border-top: 1px solid var(--border);
  }
  .related-box h4 { font-size: 0.78rem; color: var(--text-dim); margin: 0 0 8px; }
  .related-row {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    background: var(--card); border: 1px solid var(--border); border-radius: 10px;
    padding: 8px 12px; margin-bottom: 6px; font-size: 0.82rem; cursor: pointer;
  }
  .related-row:hover { box-shadow: 0 2px 8px rgba(58,51,46,0.08); }
  .ext-link { font-size: 0.78rem; white-space: nowrap; }
  .like-btn {
    font-size: 0.74rem; font-weight: 700; color: var(--accent-dark); background: #fff;
    border: 1px solid var(--border); border-radius: 10px; padding: 4px 11px; cursor: pointer; white-space: nowrap;
  }
  .like-btn.liked { color: #fff; background: var(--accent); border-color: var(--accent); cursor: default; }
  .card-actions { display: flex; justify-content: flex-end; margin-top: 8px; }
  .article-actions { display: flex; justify-content: flex-end; margin: 10px 0 0; }

  .related-articles-box { margin-top: 22px; padding-top: 16px; border-top: 1px solid var(--border); }
  .related-articles-box h4 { font-size: 0.78rem; color: var(--text-dim); margin: 0 0 8px; }
  .related-article-link {
    display: block; padding: 8px 0; font-size: 0.84rem; color: var(--text-main);
    border-bottom: 1px solid var(--border); cursor: pointer;
  }
  .related-article-link:last-child { border-bottom: none; }
  .related-article-link:hover { color: var(--accent-dark); }

  /* 選手ファンページ */
  .profile-header { display: flex; align-items: center; gap: 14px; margin-bottom: 18px; }
  .profile-header .avatar { width: 56px; height: 56px; font-size: 1.3rem; }
  .profile-name { font-size: 1.25rem; margin: 0 0 4px; }
  .profile-sub { font-size: 0.8rem; color: var(--text-dim); }
  .profile-section { margin-top: 22px; padding-top: 16px; border-top: 1px solid var(--border); }
  .profile-section h4 { font-size: 0.78rem; color: var(--text-dim); margin: 0 0 8px; }
  .profile-title-row { font-size: 0.86rem; padding: 4px 0; }
  .dan-history-row { font-size: 0.82rem; padding: 3px 0; color: var(--text-dim); }
  .dan-history-row b { color: var(--text-main); font-weight: 700; }
  .dan-badge {
    display: inline-block; font-size: 0.72rem; font-weight: 700; color: var(--accent-dark);
    background: #FFF6EE; border-radius: 8px; padding: 2px 9px; margin-left: 6px;
  }
  .profile-footer { margin-top: 24px; font-size: 0.8rem; }

  /* 選手名鑑ページ */
  .roster-league-group { margin-top: 20px; }
  .roster-league-group:first-child { margin-top: 0; }
  .roster-league-group h3 { font-size: 0.85rem; color: var(--accent-dark); margin: 0 0 6px; }
  .roster-row {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    padding: 8px 0; font-size: 0.85rem; border-bottom: 1px solid var(--border); cursor: pointer;
  }
  .roster-row:last-child { border-bottom: none; }
  .roster-row:hover { color: var(--accent-dark); }
  .roster-row .roster-right { display: flex; align-items: center; gap: 8px; flex-shrink: 0; color: var(--text-dim); font-size: 0.78rem; }

  /* 一門（師匠・弟子） */
  .lineage-row { font-size: 0.82rem; padding: 4px 0; cursor: pointer; }
  .lineage-row:hover { color: var(--accent-dark); }
  .lineage-label { color: var(--text-dim); font-size: 0.78rem; margin-right: 4px; }

  /* 人気記事ランキング */
  .ranking-box { margin-bottom: 16px; padding: 10px 14px; background: #FFFBF6; border: 1px solid var(--border); border-radius: 10px; }
  .ranking-box h4 { font-size: 0.78rem; color: var(--text-dim); margin: 0 0 6px; }
  .ranking-row {
    display: flex; align-items: center; gap: 8px; padding: 5px 0; font-size: 0.82rem; cursor: pointer;
  }
  .ranking-row:hover { color: var(--accent-dark); }
  .ranking-rank { color: var(--accent-dark); font-weight: 700; width: 1.4em; flex-shrink: 0; }
  .ranking-title { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ranking-likes { color: var(--text-dim); font-size: 0.76rem; flex-shrink: 0; }

  /* 推し個体フォロー */
  .follow-btn {
    font-size: 0.78rem; font-weight: 700; padding: 6px 14px; border-radius: 10px;
    border: 1px solid var(--accent); background: #fff; color: var(--accent-dark); cursor: pointer;
    margin-top: 6px;
  }
  .follow-btn.following { background: var(--accent); color: #fff; }
  .follow-box { margin-bottom: 16px; padding: 10px 14px; background: #FFF6EE; border: 1px solid var(--border); border-radius: 10px; }
  .follow-box h4 { font-size: 0.78rem; color: var(--text-dim); margin: 0 0 6px; }
  .follow-chip-row { display: flex; gap: 6px; flex-wrap: wrap; }
  .follow-chip {
    font-size: 0.78rem; padding: 4px 10px; border-radius: 10px; background: #fff;
    border: 1px solid var(--border); color: var(--text-main); cursor: pointer;
  }
  .card.followed { border-left: 3px solid var(--accent); }
  .oshi-badge { font-size: 0.68rem; font-weight: 700; color: var(--accent-dark); background: #FFF1E0; border-radius: 8px; padding: 2px 8px; margin-right: 4px; }
  .oshi-star { color: var(--accent-dark); margin-right: 2px; }
  .roster-new-badge { font-size: 0.68rem; color: var(--text-dim); border: 1px solid var(--border); border-radius: 8px; padding: 1px 6px; margin-right: 4px; }

  .cheer-box {
    background: var(--card); border: 1px solid var(--border); border-radius: 14px;
    padding: 14px 16px; margin-bottom: 4px;
  }
  .cheer-comment-form { display: flex; gap: 8px; }
  .cheer-comment-form input {
    flex: 1; font-family: inherit; font-size: 0.84rem; padding: 8px 12px;
    border-radius: 10px; border: 1px solid var(--border); background: #fff;
  }
  .cheer-comment-form button {
    font-size: 0.82rem; font-weight: 700; color: #fff; background: var(--accent);
    border: none; border-radius: 10px; padding: 8px 16px; cursor: pointer; white-space: nowrap;
  }
  .cheer-comment-form button.cheered { background: #FF6B8A; cursor: default; }
  .cheer-comment-list { margin-top: 10px; display: flex; flex-direction: column; gap: 6px; }
  .cheer-comment-item {
    font-size: 0.8rem; color: #5B5349; background: #FFF6EE; border-radius: 8px; padding: 6px 10px;
  }

  /* サポーター（有料支援）：無料の応援とは見た目を分け、少し特別感を出す */
  .sponsor-box {
    background: #FFFBF0; border: 1px solid #F0DDB8; border-radius: 14px;
    padding: 14px 16px; margin-top: 10px;
  }
  .sponsor-box h4 { font-size: 0.78rem; color: #8A6A2E; margin: 0 0 8px; }
  .sponsor-box p.sponsor-desc { font-size: 0.78rem; color: var(--text-dim); margin: 0 0 10px; }
  .sponsor-cta-btn {
    font-size: 0.82rem; font-weight: 700; color: #fff; background: #B8692E;
    border: none; border-radius: 10px; padding: 8px 16px; cursor: pointer;
  }
  .sponsor-list { margin-top: 12px; display: flex; flex-direction: column; gap: 6px; }
  .sponsor-item {
    display: flex; align-items: baseline; gap: 6px; font-size: 0.8rem; color: #5B5349;
    background: #FFF1E0; border-left: 3px solid #D9A24B; border-radius: 6px; padding: 6px 10px;
  }
  .sponsor-item .sponsor-name { font-weight: 700; color: #8A6A2E; flex-shrink: 0; }
  .sponsor-item .sponsor-message { overflow: hidden; text-overflow: ellipsis; }

  /* 永久スポンサー枠：1個体につき先着1名のみ。応援・通常サポーターよりも特別な扱いにする */
  .permanent-slot-box {
    border-radius: 14px; padding: 12px 16px; margin-bottom: 10px;
    border: 1px solid #E0C080; background: linear-gradient(135deg, #FFF8E8, #FFF1D0);
  }
  .permanent-slot-box h4 {
    font-size: 0.78rem; color: #96701A; margin: 0 0 6px; display: flex; align-items: center; gap: 4px;
  }
  .permanent-slot-filled { display: flex; align-items: baseline; gap: 8px; font-size: 0.86rem; }
  .permanent-slot-filled .sponsor-name { font-weight: 700; color: #96701A; }
  .permanent-slot-filled .sponsor-message { color: #5B5349; }
  .permanent-slot-empty { font-size: 0.78rem; color: var(--text-dim); display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
  .permanent-slot-empty .slot-cta-btn {
    font-size: 0.78rem; font-weight: 700; color: #fff; background: #96701A;
    border: none; border-radius: 10px; padding: 6px 12px; cursor: pointer; white-space: nowrap;
  }

  .modal-overlay {
    position: fixed; inset: 0; background: rgba(43, 36, 26, 0.45);
    display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 50;
  }
  .modal-overlay.hidden { display: none; }
  .modal-box {
    background: #fff; border-radius: 16px; padding: 20px; max-width: 360px; width: 100%;
    max-height: 90vh; overflow-y: auto;
  }
  .modal-box h3 { font-size: 0.95rem; margin: 0 0 4px; color: var(--text-main); }
  .modal-box .modal-sub { font-size: 0.78rem; color: var(--text-dim); margin: 0 0 14px; }
  .modal-close-x {
    float: right; border: none; background: none; font-size: 1.1rem; color: var(--text-dim);
    cursor: pointer; line-height: 1;
  }
  .amount-chip-row { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
  .amount-chip {
    font-size: 0.84rem; font-weight: 700; padding: 8px 14px; border-radius: 10px;
    border: 1px solid #F0DDB8; background: #FFFBF0; color: #8A6A2E; cursor: pointer;
  }
  .amount-chip.active { background: #B8692E; color: #fff; border-color: #B8692E; }
  .modal-box label { display: block; font-size: 0.76rem; color: var(--text-dim); margin: 10px 0 4px; }
  .modal-box input[type="text"], .modal-box input[type="number"] {
    width: 100%; font-family: inherit; font-size: 0.84rem; padding: 8px 10px;
    border-radius: 8px; border: 1px solid var(--border); box-sizing: border-box;
  }
  .modal-submit-btn {
    width: 100%; margin-top: 16px; font-size: 0.86rem; font-weight: 700; color: #fff;
    background: #B8692E; border: none; border-radius: 10px; padding: 10px 0; cursor: pointer;
  }
  .modal-status { font-size: 0.78rem; color: var(--text-dim); margin-top: 10px; text-align: center; }

  .rules h3 { font-size: 0.88rem; color: var(--accent-dark); margin: 22px 0 8px; }
  .rules h3:first-child { margin-top: 0; }
  .rules div.sec { font-size: 0.82rem; line-height: 1.8; color: #5B5349; }
  .rules b { color: var(--text-main); }

  .empty { color: var(--text-dim); font-size: 0.85rem; padding: 30px 0; text-align: center; }
  .footer-note {
    margin-top: 30px; padding-top: 16px; border-top: 1px solid var(--border);
    font-size: 0.7rem; color: var(--text-dim); line-height: 1.7;
  }
</style>
</head>
<body>
<div class="page">
  <header>
    <div>
      <a class="brand-link" href="#" onclick="navigateTo('');return false;">
        <div class="brand">オセロ界タイムズ</div>
      </a>
      <div class="tagline">CIRCUIT OTHELLO LEAGUEの非公式ファンメディア（これは架空のリーグです）</div>
    </div>
    <nav>
      <a class="nav-tab" id="nav-feed" href="#" onclick="navigateTo('');return false;">フィード</a>
      <a class="nav-tab" id="nav-individuals" href="#" onclick="navigateTo('individuals');return false;">選手名鑑</a>
      <a class="nav-tab" id="nav-rules" href="#" onclick="navigateTo('rules');return false;">ルール</a>
      <a class="nav-external" href="https://lab.spia-net.com/othello-league/" target="_blank" rel="noopener">データサイトへ ↗</a>
    </nav>
  </header>
  <div id="holders"></div>
  <div id="content"><div class="empty">読み込み中…</div></div>
  <div class="modal-overlay hidden" id="sponsor-modal-overlay">
    <div class="modal-box">
      <button class="modal-close-x" id="sponsor-modal-close">×</button>
      <h3>サポーターになる</h3>
      <p class="modal-sub">100円：名前を掲載／300円：一言メッセージも掲載／500円：空いていれば永久スポンサー枠（先着1名）。支援した金額自体は表示されません。</p>
      <div class="amount-chip-row" id="sponsor-amount-chips">
        <button type="button" class="amount-chip" data-amount="100">100円</button>
        <button type="button" class="amount-chip" data-amount="300">300円</button>
        <button type="button" class="amount-chip" data-amount="500" data-permanent="true">500円</button>
      </div>
      <p class="modal-sub" id="sponsor-amount-hint" style="min-height:1.2em;"></p>
      <label for="sponsor-amount-custom">その他の金額（円）</label>
      <input type="number" id="sponsor-amount-custom" min="100" step="100" placeholder="例：2000">
      <label for="sponsor-name">表示名</label>
      <input type="text" id="sponsor-name" maxlength="30" placeholder="名無しの支援者">
      <label for="sponsor-message">一言（任意・100文字まで）</label>
      <input type="text" id="sponsor-message" maxlength="100" placeholder="応援しています！">
      <button class="modal-submit-btn" id="sponsor-submit-btn">この内容でStripeに進む</button>
      <div class="modal-status" id="sponsor-modal-status"></div>
    </div>
  </div>
  <div class="footer-note">
    「オセロ界タイムズ」は架空のオセロリーグ（CIRCUIT OTHELLO LEAGUE）を題材にした、ファンによる非公式のニュースメディアです。登場する個体・対局結果はすべて自動対局シミュレーションによるものであり、実在の人物・団体とは関係ありません。
  </div>
</div>

<script>
const TAG_COLORS = {
  '速報': { bg: '#EAF4FC', fg: '#2D6FA6' },
  '結果': { bg: '#F1EBFB', fg: '#6B4FA0' },
  '展望': { bg: '#FDEFF5', fg: '#B84C78' },
  '特集': { bg: '#FFF1E6', fg: '#B8692E' },
  'コラム': { bg: '#E6F7F3', fg: '#1F8A72' },
  '挑戦者決定': { bg: '#E9F7EE', fg: '#2F7A52' },
  '深掘り': { bg: '#FFF1E6', fg: '#B8692E' },
  '青龍': { bg: '#EAF4FC', fg: '#2D6FA6' },
  '朱雀': { bg: '#FDEFF5', fg: '#B84C78' },
  '白虎': { bg: '#F1EBFB', fg: '#6B4FA0' },
  '玄武': { bg: '#FFF1E6', fg: '#B8692E' },
};
const AVATAR_PALETTE = [
  { bg: '#E6F0FA', fg: '#2D6FA6' }, { bg: '#FDEFF5', fg: '#B84C78' },
  { bg: '#F1EBFB', fg: '#6B4FA0' }, { bg: '#FFF1E6', fg: '#B8692E' },
  { bg: '#E9F7EE', fg: '#2F7A52' },
];
const RESULTS_SITE_BASE = 'https://lab.spia-net.com/othello-league/';

let _articles = null;
let _holders = null;

function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
}

function hashString(s) {
  let h = 0;
  for (let i = 0; i < s.length; i++) { h = (h * 31 + s.charCodeAt(i)) >>> 0; }
  return h;
}

function avatarFor(name, seed) {
  const palette = AVATAR_PALETTE[hashString(seed || name || '?') % AVATAR_PALETTE.length];
  const initial = (name || '?').charAt(0);
  return `<div class="avatar" style="background:${palette.bg}; color:${palette.fg};">${escapeHtml(initial)}</div>`;
}

function tagChip(tag) {
  const c = TAG_COLORS[tag] || { bg: '#F1EBFB', fg: '#6B4FA0' };
  return `<span class="tag" style="background:${c.bg}; color:${c.fg};" data-filter-tag="${escapeHtml(tag)}">${escapeHtml(tag)}</span>`;
}

function resultsSiteIndividualUrl(id) {
  return `${RESULTS_SITE_BASE}#individual/${encodeURIComponent(id)}`;
}

// 推し個体フォロー：サーバー側には何も送らず、この端末のlocalStorageだけで管理する
// （「推し」を登録しておくと、フィードでその個体が関係する記事が目立つようになる）
const FOLLOW_STORAGE_KEY = 'othello_news_follows';

function getFollowedIndividuals() {
  try {
    const raw = localStorage.getItem(FOLLOW_STORAGE_KEY);
    return raw ? JSON.parse(raw) : [];
  } catch (e) {
    return [];
  }
}

function isFollowed(id) {
  return getFollowedIndividuals().some(f => f.id === id);
}

function toggleFollow(id, name) {
  let list = getFollowedIndividuals();
  if (list.some(f => f.id === id)) {
    list = list.filter(f => f.id !== id);
  } else {
    list.push({ id, name });
  }
  try { localStorage.setItem(FOLLOW_STORAGE_KEY, JSON.stringify(list)); } catch (e) { /* 無視 */ }
  return isFollowed(id);
}

// 段位表示（データサイト側のDAN_KANJI/danLabelと同じもの。api.phpがdan/dan_historyとして返す）
const DAN_KANJI = { 1: '一', 2: '二', 3: '三', 4: '四', 5: '五', 6: '六', 7: '七', 8: '八', 9: '九' };
function danLabel(dan) {
  return (dan === null || dan === undefined) ? '-' : `${DAN_KANJI[dan] ?? dan}段`;
}
function renderDanHistory(history) {
  if (!history || !history.length) return '<div style="color:var(--text-dim); font-size:0.84rem;">段位履歴なし</div>';
  return history.slice().reverse().map(h =>
    `<div class="dan-history-row">第${h.season}季：<b>${danLabel(h.dan)}</b>　${escapeHtml(h.reason)}</div>`
  ).join('');
}

function timeAgo(iso) {
  const diffMs = Date.now() - new Date(iso).getTime();
  const h = Math.floor(diffMs / 3600000);
  if (h < 1) return 'たった今';
  if (h < 24) return `${h}時間前`;
  const d = Math.floor(h / 24);
  if (d < 7) return `${d}日前`;
  return new Date(iso).toLocaleDateString('ja-JP');
}

async function loadArticles() {
  if (_articles) return _articles;
  const res = await fetch('./articles.json', { cache: 'no-store' });
  const data = await res.json();
  _articles = data.slice().sort((a, b) => new Date(b.published_at) - new Date(a.published_at));
  return _articles;
}

async function loadHolders() {
  if (_holders) return _holders;
  try {
    const res = await fetch('./season_state.json', { cache: 'no-store' });
    if (!res.ok) throw new Error('not found');
    _holders = await res.json();
  } catch (e) {
    _holders = null;
  }
  return _holders;
}

function primaryName(article) {
  return article.related_individual_names && article.related_individual_names[0]
    || (article.related_individual_ids && article.related_individual_ids[0]) || '?';
}

function relatedPairs(article) {
  const ids = article.related_individual_ids || [];
  const names = article.related_individual_names || [];
  return ids.map((id, i) => ({ id, name: names[i] || id }));
}

async function renderHolders() {
  const el = document.getElementById('holders');
  const state = await loadHolders();
  const holders = state && state.titleholders;
  if (!holders) { el.innerHTML = ''; return; }
  const order = ['青龍', '朱雀', '白虎', '玄武'];
  const slots = order.map(title => {
    const h = holders[title];
    const name = h && h.name ? h.name : '空位';
    const onclick = h && h.id ? `navigateTo('individual/${encodeURIComponent(h.id)}')` : '';
    return `<div class="holder-slot" ${onclick ? `onclick="${onclick}"` : ''}>
      <div class="holder-title">${escapeHtml(title)}</div>
      <div class="holder-name">${escapeHtml(name)}</div>
    </div>`;
  }).join('');
  const seasonLine = state.current_season
    ? `<div class="holders-season">第${state.current_season}季・現在のタイトル保持者</div>` : '';
  el.innerHTML = `<div class="holders-card">${slots}</div>${seasonLine}`;
}

function parseFilter(hash) {
  if (hash.startsWith('tag/')) return { type: 'tag', value: decodeURIComponent(hash.slice(4)) };
  if (hash.startsWith('season/')) return { type: 'season', value: Number(hash.slice(7)) };
  return null;
}

function applyFilter(articles, filter) {
  if (!filter) return articles;
  if (filter.type === 'tag') return articles.filter(a => (a.tags || []).includes(filter.value));
  if (filter.type === 'season') return articles.filter(a => a.season === filter.value);
  return articles;
}

function filterLabel(articles, filter) {
  if (filter.type === 'tag') return `タグ「${filter.value}」の記事`;
  if (filter.type === 'season') return `第${filter.value}季の記事`;
  return '';
}

function setActiveNav(tab) {
  document.getElementById('nav-feed').classList.toggle('active', tab === 'feed');
  document.getElementById('nav-individuals').classList.toggle('active', tab === 'individuals');
  document.getElementById('nav-rules').classList.toggle('active', tab === 'rules');
}

// 人気記事ランキング：article_like.phpのaction=counts（全記事いいね数の一括取得）を使い、
// いいね数上位5件をフィードの先頭に表示する（記事ごとに個別フェッチしない）
async function renderPopularRanking(allArticles) {
  let counts;
  try {
    const res = await fetch(`${RESULTS_SITE_BASE}article_like.php?action=counts`);
    const data = await res.json();
    counts = data.counts || {};
  } catch (e) {
    return '';
  }
  const ranked = allArticles
    .map(a => ({ id: a.id, title: a.title, count: counts[a.id] || 0 }))
    .filter(a => a.count > 0)
    .sort((a, b) => b.count - a.count)
    .slice(0, 5);
  if (ranked.length === 0) return '';

  return `<div class="ranking-box">
    <h4>人気記事ランキング（いいね数）</h4>
    ${ranked.map((a, i) => `
      <div class="ranking-row" data-ranking-article="${escapeHtml(a.id)}">
        <span class="ranking-rank">${i + 1}</span>
        <span class="ranking-title">${escapeHtml(a.title)}</span>
        <span class="ranking-likes">♥ ${a.count}</span>
      </div>`).join('')}
  </div>`;
}

// 関連記事：同じタグ・関連個体を持つ他記事を、関連度（共有タグ数・共有個体数）順に最大3件返す
function relatedArticlesFor(article, allArticles) {
  const tags = new Set(article.tags || []);
  const inds = new Set(article.related_individual_ids || []);
  const scored = allArticles
    .filter(o => o.id !== article.id)
    .map(o => {
      let score = 0;
      (o.tags || []).forEach(t => { if (tags.has(t)) score += 1; });
      (o.related_individual_ids || []).forEach(id => { if (inds.has(id)) score += 2; });
      return { o, score };
    })
    .filter(x => x.score > 0);
  scored.sort((a, b) => b.score - a.score || new Date(b.o.published_at) - new Date(a.o.published_at));
  return scored.slice(0, 3).map(x => x.o);
}

// 応援ボタン：実際の金銭のやり取りは発生しない、閲覧専用のカウンタ（いいね的な機能）。
// cheer.php・api.phpはデータサイト（RESULTS_SITE_BASE）側にあるため、絶対URLで呼び出す
// （同一オリジンのパス違いなのでCORS上の問題は無い）
function cheeredTodayKey(id) {
  return `cheered:${id}:${new Date().toISOString().slice(0, 10)}`;
}
async function loadCheerCount(id) {
  try {
    const res = await fetch(`${RESULTS_SITE_BASE}api.php?action=individual&id=${encodeURIComponent(id)}`);
    const data = await res.json();
    return data.individual && typeof data.individual.cheer_count === 'number' ? data.individual.cheer_count : 0;
  } catch (e) {
    return null;
  }
}
// 記事への「いいね」：cheer.phpと同じ考え方（閲覧専用カウンタ、実際の金銭のやり取りは無い）
function likedTodayKey(articleId) {
  return `liked:${articleId}:${new Date().toISOString().slice(0, 10)}`;
}
async function loadLikeCount(articleId) {
  try {
    const res = await fetch(`${RESULTS_SITE_BASE}article_like.php?article_id=${encodeURIComponent(articleId)}`);
    const data = await res.json();
    return typeof data.like_count === 'number' ? data.like_count : 0;
  } catch (e) {
    return null;
  }
}
async function setupLikeButton(btn) {
  const id = btn.dataset.likeId;
  const countEl = btn.querySelector('.like-count');
  const count = await loadLikeCount(id);
  if (count !== null && countEl) countEl.textContent = `（${count}）`;

  let likedLocally = false;
  try { likedLocally = localStorage.getItem(likedTodayKey(id)) === '1'; } catch (e) { /* 無視 */ }
  if (likedLocally) {
    btn.classList.add('liked');
    btn.childNodes[0].textContent = '♥ いいね済み';
  }

  btn.addEventListener('click', async (ev) => {
    ev.stopPropagation();
    if (btn.classList.contains('liked')) return;
    btn.disabled = true;
    try {
      const res = await fetch(`${RESULTS_SITE_BASE}article_like.php`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ article_id: id }),
      });
      const data = await res.json();
      if (data.error) throw new Error(data.error);
      if (countEl) countEl.textContent = `（${data.like_count}）`;
      btn.classList.add('liked');
      btn.childNodes[0].textContent = '♥ いいね済み';
      try { localStorage.setItem(likedTodayKey(id), '1'); } catch (e) { /* 無視 */ }
    } catch (e) {
      btn.disabled = false;
    }
  });
}

  const count = await loadCheerCount(id);
  if (count !== null && countEl) countEl.textContent = `（${count}）`;

  let alreadyCheeredLocally = false;
  try { alreadyCheeredLocally = localStorage.getItem(cheeredTodayKey(id)) === '1'; } catch (e) { /* 無視 */ }
  if (alreadyCheeredLocally) {
    btn.classList.add('cheered');
    btn.childNodes[0].textContent = '♡ 応援済み';
    messageInput.disabled = true;
    messageInput.placeholder = '今日はもう応援済みです。また明日！';
  }

  form.addEventListener('submit', async (ev) => {
    ev.preventDefault();
    if (btn.classList.contains('cheered')) return;
    btn.disabled = true;
    try {
      const res = await fetch(`${RESULTS_SITE_BASE}cheer.php`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ individual_id: id, message: messageInput.value.trim() }),
      });
      const data = await res.json();
      if (data.error) throw new Error(data.error);
      if (countEl) countEl.textContent = `（${data.cheer_count}）`;
      btn.classList.add('cheered');
      btn.childNodes[0].textContent = '♡ 応援済み';
      messageInput.disabled = true;
      try { localStorage.setItem(cheeredTodayKey(id), '1'); } catch (e) { /* 無視 */ }
      loadProfileComments(id);
    } catch (e) {
      btn.disabled = false;
    }
  });

  loadProfileComments(id);
}

async function loadProfileComments(id) {
  const el = document.getElementById('profile-cheer-comments');
  if (!el) return;
  try {
    const res = await fetch(`${RESULTS_SITE_BASE}cheer.php?action=comments&individual_id=${encodeURIComponent(id)}`);
    const data = await res.json();
    const list = data.comments || [];
    el.innerHTML = list.map(c => `<div class="cheer-comment-item">${escapeHtml(c.message)}</div>`).join('');
  } catch (e) {
    el.innerHTML = '';
  }
}

// サポーター（有料支援）：見た目・モーダルのみ先行実装。実際の決済（Stripe Checkout）
// 連携は別途行うため、送信ボタンは「準備中」のステータス表示のみで実際の送信はしない
let _sponsorTargetId = null;

function setupSponsorUI(id) {
  const ctaBtn = document.getElementById('sponsor-cta-btn');
  const overlay = document.getElementById('sponsor-modal-overlay');
  const closeBtn = document.getElementById('sponsor-modal-close');
  const chips = document.querySelectorAll('#sponsor-amount-chips .amount-chip');
  const customInput = document.getElementById('sponsor-amount-custom');
  const submitBtn = document.getElementById('sponsor-submit-btn');
  const statusEl = document.getElementById('sponsor-modal-status');

  ctaBtn.onclick = () => {
    _sponsorTargetId = id;
    chips.forEach(c => c.classList.remove('active'));
    customInput.value = '';
    document.getElementById('sponsor-name').value = '';
    document.getElementById('sponsor-message').value = '';
    statusEl.textContent = '';
    document.getElementById('sponsor-amount-hint').textContent = '';
    overlay.classList.remove('hidden');
  };
  closeBtn.onclick = () => overlay.classList.add('hidden');
  overlay.onclick = (ev) => { if (ev.target === overlay) overlay.classList.add('hidden'); };

  const hintEl = document.getElementById('sponsor-amount-hint');
  chips.forEach(chip => {
    chip.onclick = () => {
      chips.forEach(c => c.classList.remove('active'));
      chip.classList.add('active');
      customInput.value = '';
      hintEl.textContent = chip.dataset.permanent
        ? '💡 この金額を選ぶと、空いていればこの選手の永久スポンサー（先着1名）になれます'
        : '';
    };
  });
  customInput.oninput = () => {
    if (customInput.value) chips.forEach(c => c.classList.remove('active'));
    hintEl.textContent = '';
  };

  submitBtn.onclick = () => {
    const activeChip = document.querySelector('#sponsor-amount-chips .amount-chip.active');
    const amount = activeChip ? Number(activeChip.dataset.amount) : Number(customInput.value || 0);
    if (!amount || amount < 100) {
      statusEl.textContent = '金額を選択するか、100円以上を入力してください';
      return;
    }
    // Stripe連携は未実装（見た目のみ先行実装中）。連携後はここでCheckout Sessionの
    // 作成エンドポイントを呼び、返ってきたURLへリダイレクトする想定
    statusEl.textContent = '決済連携は準備中です。もうしばらくお待ちください🙏';
  };
}

async function loadSponsorList(id) {
  const el = document.getElementById('sponsor-list');
  const permEl = document.getElementById('permanent-slot-box');
  if (!el) return;
  try {
    const res = await fetch(`${RESULTS_SITE_BASE}sponsor.php?individual_id=${encodeURIComponent(id)}`);
    const data = await res.json();
    const list = data.sponsors || [];
    el.innerHTML = list.length
      ? list.map(s => `<div class="sponsor-item">
          <span class="sponsor-name">${escapeHtml(s.display_name)}</span>
          ${s.message ? `<span class="sponsor-message">${escapeHtml(s.message)}</span>` : ''}
        </div>`).join('')
      : '<div style="color:var(--text-dim); font-size:0.78rem;">まだサポーターはいません</div>';

    if (permEl) {
      permEl.innerHTML = data.permanent
        ? `<h4>👑 永久スポンサー</h4>
           <div class="permanent-slot-filled">
             <span class="sponsor-name">${escapeHtml(data.permanent.display_name)}</span>
             ${data.permanent.message ? `<span class="sponsor-message">${escapeHtml(data.permanent.message)}</span>` : ''}
           </div>`
        : `<h4>👑 永久スポンサー枠</h4>
           <div class="permanent-slot-empty">
             <span>先着1名限定。この選手が引退するまで名前が残り続けます。まだ空いています。</span>
             <button type="button" class="slot-cta-btn" id="permanent-slot-cta-btn">空席を埋める</button>
           </div>`;
      const slotBtn = document.getElementById('permanent-slot-cta-btn');
      if (slotBtn) slotBtn.onclick = () => {
        document.getElementById('sponsor-cta-btn').click();
        document.querySelector('#sponsor-amount-chips .amount-chip[data-permanent]').click();
      };
    }
  } catch (e) {
    el.innerHTML = '';
    if (permEl) permEl.innerHTML = '';
  }
}

// 選手名鑑：記事経由以外にも選手ファンページへの導線を用意するためのページ。
// 将棋連盟の棋士データベース（現役/引退を別リストで持ち、現役は段位別にも見られる）を
// 参考に、現役⇄引退の切り替えと、現役側はリーグ別⇄段位別の切り替えを持たせている
let _rosterView = 'active'; // 'active' | 'retired'
let _rosterGroupBy = 'league'; // 'league' | 'dan'

// タイトル獲得数バッジ（現役・引退どちらの一覧でも使う共通部品）。
// 永世称号の有無はここでは示さない（分かりにくいため）。該当する場合は
// 個体ページ側に明記する（renderIndividualProfile参照）
function titleCountBadgeHtml(r) {
  if (!r.title_count) return '';
  return ` <span class="oshi-badge">タイトル${r.title_count}期</span>`;
}

function rosterRowHtml(r, extraBadge) {
  const ageLabel = r.age != null ? `${r.age}歳　` : '';
  const newBadge = r.is_new ? '<span class="roster-new-badge">新</span> ' : '';
  return `<div class="roster-row" data-goto-individual="${escapeHtml(r.id)}">
      <span>${isFollowed(r.id) ? '<span class="oshi-star">★</span>' : ''}${newBadge}${escapeHtml(r.display_name || r.id)}${extraBadge || ''}</span>
      <span class="roster-right">${ageLabel}${danLabel(r.dan)}　${r.eloLabel}</span>
    </div>`;
}

function rosterViewChipsHtml() {
  return `<div class="chip-row">
      <button class="chip-btn ${_rosterView === 'active' ? 'active' : ''}" data-roster-view="active">現役</button>
      <button class="chip-btn ${_rosterView === 'retired' ? 'active' : ''}" data-roster-view="retired">引退</button>
    </div>`;
}

function wireRosterCommon(el) {
  el.querySelectorAll('[data-goto-individual]').forEach(elm => {
    elm.addEventListener('click', () => navigateTo('individual/' + encodeURIComponent(elm.dataset.gotoIndividual)));
  });
  el.querySelectorAll('[data-roster-view]').forEach(elm => {
    elm.addEventListener('click', () => { _rosterView = elm.dataset.rosterView; renderIndividualList(); });
  });
  el.querySelectorAll('[data-roster-group]').forEach(elm => {
    elm.addEventListener('click', () => { _rosterGroupBy = elm.dataset.rosterGroup; renderIndividualList(); });
  });
}

async function renderIndividualList() {
  setActiveNav('individuals');
  const el = document.getElementById('content');
  el.innerHTML = '<div class="empty">読み込み中…</div>';

  if (_rosterView === 'retired') {
    let data;
    try {
      const res = await fetch(`${RESULTS_SITE_BASE}api.php?action=retired_archive&limit=100`);
      data = await res.json();
      if (!data.retired) throw new Error('not found');
    } catch (e) {
      el.innerHTML = rosterViewChipsHtml() + '<div class="empty">選手名鑑（引退）の読み込みに失敗しました</div>';
      wireRosterCommon(el);
      return;
    }
    const rows = data.retired.map(r => ({ ...r, eloLabel: `最高Elo ${Math.round(r.peak_elo)}（第${r.debut_season}〜${r.retired_season}季）` }));
    const rowsHtml = rows.map(r => rosterRowHtml(r, titleCountBadgeHtml(r))).join('');
    el.innerHTML = `${rosterViewChipsHtml()}
      <div class="empty" style="padding:0 0 16px; text-align:left; color:var(--text-dim); font-size:0.8rem;">
        引退した選手の名鑑です（タイトル獲得数が多い順）。
      </div>
      <div class="roster-league-group">
        <h3>引退選手（${rows.length}名）</h3>
        ${rowsHtml || '<div class="empty">まだ引退した選手はいません</div>'}
      </div>`;
    wireRosterCommon(el);
    return;
  }

  let data;
  try {
    const res = await fetch(`${RESULTS_SITE_BASE}api.php?action=leagues`);
    data = await res.json();
    if (!data.leagues) throw new Error('not found');
  } catch (e) {
    el.innerHTML = rosterViewChipsHtml() + '<div class="empty">選手名鑑の読み込みに失敗しました</div>';
    wireRosterCommon(el);
    return;
  }

  const groupChipsHtml = `<div class="chip-row">
      <button class="chip-btn ${_rosterGroupBy === 'league' ? 'active' : ''}" data-roster-group="league">リーグ別</button>
      <button class="chip-btn ${_rosterGroupBy === 'dan' ? 'active' : ''}" data-roster-group="dan">段位別</button>
    </div>`;

  const leagues = data.leagues;
  let groupsHtml;
  if (_rosterGroupBy === 'dan') {
    const all = ['A', 'B', 'C', 'D'].flatMap(lg => leagues[lg] || []);
    const byDan = {};
    all.forEach(r => { (byDan[r.dan] = byDan[r.dan] || []).push(r); });
    const dans = Object.keys(byDan).map(Number).sort((a, b) => b - a);
    groupsHtml = dans.map(dan => {
      const rows = byDan[dan].slice().sort((a, b) => b.elo_rating - a.elo_rating)
        .map(r => ({ ...r, eloLabel: `Elo ${Math.round(r.elo_rating)}` }));
      return `<div class="roster-league-group">
        <h3>${danLabel(dan)}（${rows.length}名）</h3>
        ${rows.map(r => rosterRowHtml(r, titleCountBadgeHtml(r))).join('') || '<div class="empty">在籍者なし</div>'}
      </div>`;
    }).join('');
  } else {
    groupsHtml = ['A', 'B', 'C', 'D'].map(lg => {
      const rows = (leagues[lg] || []).map(r => ({ ...r, eloLabel: `Elo ${Math.round(r.elo_rating)}` }));
      return `<div class="roster-league-group">
        <h3>${lg}リーグ（${rows.length}名）</h3>
        ${rows.map(r => rosterRowHtml(r, titleCountBadgeHtml(r))).join('') || '<div class="empty">在籍者なし</div>'}
      </div>`;
    }).join('');
  }

  el.innerHTML = `${rosterViewChipsHtml()}${groupChipsHtml}
    <div class="empty" style="padding:0 0 10px; text-align:left; color:var(--text-dim); font-size:0.8rem;">
      現役選手の名鑑です。名前をクリックすると選手ファンページへ移動します。
    </div>
    ${groupsHtml}`;

  wireRosterCommon(el);
}

function renderRules() {
  setActiveNav('rules');
  const el = document.getElementById('content');
  el.innerHTML = `<div class="rules">
    <h3>リーグ制度</h3>
    <div class="sec">
      A（9名・総当たり）／B（12名）・C（16名）・D（人数は変動。毎季固定2名を新人として受け入れる）（スイス方式・6回戦）の4部制。<br>
      A⇄B：下位2名⇄上位2名を毎季入れ替え。B⇄C：下位3名⇄上位3名。C⇄D：下位3名⇄上位3名を毎季入れ替え。<br>
      本戦（A総当たり・B/C/Dスイス方式）は引き分けを引き分けのまま確定し、再戦は行わない
      （例外：Aリーグの1位が複数名並んだ場合のみ、同率者同士で順位決定戦を行う。これは決着まで最大3回まで再戦する）。
    </div>

    <h3>一門と弟子</h3>
    <div class="sec">
      新弟子は師弟制：Dリーグの新人受け入れ枠（毎季固定2名）ぶん、現役個体から選ばれた「師匠」1人ごとに、そのパラメータを変異（±15%程度）
      させた弟子が1人入門する（2個体の交配ではない）。師匠になれるのは30歳以上の個体のみ。
      師弟関係は新人リーグの出走時点で決定し、その後Dリーグへ昇格しても変わらない。<br>
      師匠選びはランダムだが、Elo・タイトル保持で重み付けされており、実力のある個体ほど弟子を持ちやすい。<br>
      一門は、最も遡った開祖を根とする師弟の系譜のまとまり。同じ師匠につく弟子が5人を超えた時点で、
      6人目以降の弟子は新しい一門の開祖として分岐する。さらに稀（8%）に、師匠を持たず完全にランダムな
      能力の新規開祖が参入することもある。<br>
      稀（3%）に、新弟子の誰かが「覚醒」し、1パラメータが通常の変異幅を超えて大きく伸びることがある
      （「神童」として通常より若い14〜16歳で参入）。<br>
      本戦・新人リーグとも<b>1日2回、本戦→新人リーグの順</b>で実行：<br>
      ・6:00(JST)までのエントリー → 7:00の新人リーグで選抜（固定2名を募集） → 夜18:00の本戦からDリーグ入り<br>
      ・6:00〜18:00(JST)のエントリー → 19:00の新人リーグで選抜（固定2名を募集） → 翌朝6:00の本戦からDリーグ入り<br>
      新人リーグの募集人数は在籍者数に関わらず常に2名。昇格枠の境界で同成績が並んだ場合は、
      該当者同士で引き分け無しのプレーオフを行い昇格者を決める。<br>
      新人リーグで昇格しなかった個体のうち、順位上位5名は師弟関係を保ったまま次回へ持ち越される。
    </div>

    <h3>引退</h3>
    <div class="sec">
      年齢（初期年齢＋通算シーズン数）が60歳に達すると、リーグを問わず強制引退する。<br>
      Dリーグは「降級点」制：負け越した季ごとに1点積み重なり、2点で実力・在籍年数に関わらず即引退
      するup-or-out制（勝ち越した季は1点減る）。<br>
      Dリーグは新人を毎季固定2名受け入れる一方、在籍者数には大きめのバッファを持たせてあり、
      在籍者数の増減を理由にした強制引退は発生しない。<br>
      タイトル保持者・朱雀紅白リーグ在籍者・Aリーグ所属者（今季A→B降格が決まった者を除く）は、
      これらの条件から猶予される。
    </div>

    <h3>タイトル戦</h3>
    <div class="sec">
      <b>青龍</b>（名人モデル）：Aリーグ総当たり優勝者が挑戦。7局制4本先取。在位者はAリーグ総当たりを免除される防衛専念枠。<br><br>
      <b>朱雀</b>（王位モデル）：紅組・白組（各5名）の永続サブリーグ制。両組1位の挑戦者決定戦（5局制3本先取）を経て、
      朱雀在位者（5局制3本先取）に挑む。下位2名×2組は外部との入れ替えトーナメントで補充。<br><br>

      <b>玄武</b>：ほぼ全所属個体が参加する抽選トーナメント（超早指し戦）。5局制3本先取。ブラケットサイズ64。在位者は防衛専念枠。<br><br>
      初代不在のタイトルは、挑戦者が無条件で襲名する。タイトル戦・挑戦者決定戦は引き分けなら決着するまで再戦するが、
      A総当たり・B/C/Dスイス方式には適用されない（上記の通り）。<br><br>
      探索深さ（運用上固定）：A/B/C/D本戦=4、青龍タイトル戦=5／朱雀予選=3・タイトル戦=5／
      白虎予選=3・タイトル戦=4／玄武予選=2・タイトル戦=3。
    </div>

    <h3>永世称号</h3>
    <div class="sec">
      タイトルごとに基準が異なる。永世青龍：通算5期保持。永世朱雀：連続5期保持、または通算10期保持。
      永世白虎：連続5期保持。永世玄武：通算10期保持。一度獲得すると、その後失冠しても称号は残る。
    </div>

    <h3>段位</h3>
    <div class="sec">
      対局結果・リーグ経験・タイトル実績から算出する表示専用の指標。新人は4段スタートし、勝数・昇格・
      タイトル挑戦・タイトル獲得・永世称号などに応じて段位が上がる（詳細な昇段条件はデータサイトのルール説明を参照）。
    </div>

    <h3>Eloレーティング</h3>
    <div class="sec">
      標準的なEloレーティングを対局ごとに更新する。K値は在籍季数に応じて段階的に下げる：
      在籍3季未満はK=18、8季未満はK=13、それ以上はK=10
      （過去の全対局データを用いたブライアスコア最小化により再調整済み）。
    </div>
  </div>`;
}

function navigateTo(path) {
  location.hash = path ? `#${path}` : '';
}

function route() {
  const hash = location.hash.replace(/^#/, '');
  if (hash === 'rules') {
    renderRules();
  } else if (hash === 'individuals') {
    renderIndividualList();
  } else if (hash.startsWith('article/')) {
    renderArticle(decodeURIComponent(hash.slice('article/'.length)));
  } else if (hash.startsWith('individual/')) {
    renderIndividualProfile(decodeURIComponent(hash.slice('individual/'.length)));
  } else {
    renderFeed(parseFilter(hash));
  }
}

renderHolders();
window.addEventListener('hashchange', route);
route();
</script>
