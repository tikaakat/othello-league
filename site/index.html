    </div>
    <div style="text-align:center; font-size:0.68rem; color:var(--text-dim); margin-top:6px;">盤面タップ：右半分＝進む／左半分＝戻る</div>
    ${games.length > 1 ? `<div style="text-align:center; margin-top:10px;"><button id="btn-prev-game" ${gameIdx===0?'disabled':''}>◀ 前の局</button> <button id="btn-next-game" ${gameIdx===games.length-1?'disabled':''}>次の局 ▶</button></div>` : ''}
  `;
  document.getElementById('game-back').addEventListener('click', () => { stopAutoplay(); navigateTo('matches'); });
  document.getElementById('btn-first').addEventListener('click', () => { stopAutoplay(); setMoveIdx(0); });
  document.getElementById('btn-prev').addEventListener('click', () => { stopAutoplay(); setMoveIdx(gameState.moveIdx - 1); });
  document.getElementById('btn-next').addEventListener('click', () => { stopAutoplay(); setMoveIdx(gameState.moveIdx + 1); });
  document.getElementById('btn-last').addEventListener('click', () => { stopAutoplay(); setMoveIdx(gameState.games[gameState.gameIdx].moves.length); });
  document.getElementById('btn-autoplay').addEventListener('click', toggleAutoplay);
  const boardEl = document.getElementById('othello-board');
  for (let i = 0; i < 64; i++) {
    const sq = document.createElement('div'); sq.className = 'osq'; sq.dataset.pos = i;
    boardEl.appendChild(sq);
  }
  boardEl.addEventListener('click', (e) => {
    stopAutoplay();
    const rect = boardEl.getBoundingClientRect();
    const clickX = e.clientX - rect.left;
    if (clickX > rect.width / 2) setMoveIdx(gameState.moveIdx + 1);
    else setMoveIdx(gameState.moveIdx - 1);
  });
  if (games.length > 1) {
    const pg = document.getElementById('btn-prev-game'), ng = document.getElementById('btn-next-game');
    if (pg) pg.addEventListener('click', () => { gameState.gameIdx--; gameState.moveIdx = 0; renderGamePanel(); });
    if (ng) ng.addEventListener('click', () => { gameState.gameIdx++; gameState.moveIdx = 0; renderGamePanel(); });
  }
  setMoveIdx(0);
}

function setMoveIdx(idx) {
  const game = gameState.games[gameState.gameIdx];
  const moves = game.moves || [];
  idx = Math.max(0, Math.min(moves.length, idx));
  gameState.moveIdx = idx;

  const board = makeInitialBoard();
  for (let i = 0; i < idx; i++) applyOthelloMove(board, moves[i].pos, moves[i].color);

  document.querySelectorAll('#othello-board .osq').forEach(sq => {
    const val = board[parseInt(sq.dataset.pos, 10)];
    sq.innerHTML = val === BLACK ? '<div class="disc disc-black"></div>' : val === WHITE ? '<div class="disc disc-white"></div>' : '';
  });
  const black = board.filter(c => c === BLACK).length, white = board.filter(c => c === WHITE).length;
  document.getElementById('move-counter').textContent = `${idx} / ${moves.length}手`;
  document.getElementById('move-label').textContent = `黒${black} - 白${white}`;
}

let autoplayTimer = null;
function stopAutoplay() {
  if (autoplayTimer) {
    clearInterval(autoplayTimer);
    autoplayTimer = null;
    const btn = document.getElementById('btn-autoplay');
    if (btn) btn.textContent = '▶ 自動再生';
  }
}
function toggleAutoplay() {
  const btn = document.getElementById('btn-autoplay');
  if (autoplayTimer) { stopAutoplay(); return; }
  const moves = gameState.games[gameState.gameIdx].moves || [];
  if (gameState.moveIdx >= moves.length) setMoveIdx(0);
  btn.textContent = '⏸ 停止';
  autoplayTimer = setInterval(() => {
    const moves = gameState.games[gameState.gameIdx].moves || [];
    if (gameState.moveIdx >= moves.length) { stopAutoplay(); return; }
    setMoveIdx(gameState.moveIdx + 1);
  }, 700);
}

function eloTwoLine(current, peak) {

// 同率順位（1位、1位、3位…のように、同じ値なら同じ順位にし、次の順位を人数分飛ばす）を算出する。
// rowsは既に比較キーの降順にソートされている前提（同値は連続して並ぶ）。
function competitionRanks(rows, keyFn) {
  const ranks = [];
  let rank = 0, prevKey;
  rows.forEach((r, i) => {
    const key = keyFn(r);
    if (i === 0 || key !== prevKey) rank = i + 1;
    prevKey = key;
    ranks.push(rank);
  });
  return ranks;
}

let _collapsibleSeq = 0;
function renderCollapsibleTable(headHtml, rows, rowFn, topN, keyFn) {
  // 上位topN件は常時表示、残りは折りたたみにする共通ヘルパー（表彰・殿堂タブで使用）。
  // keyFnを渡すと、rowFn(row, rank) の第2引数に同率順位（1,1,3方式）が渡される。
  // 渡さない場合は従来通りの連番（1,2,3…）になる。
  // 列数の多い表（殿堂の総合ランキング等）がパネル幅からはみ出さないよう、
  // 各<table>はoverflow-x:autoのラッパーで囲み、収まらない分は横スクロールにする
  const uid = 'cq' + (_collapsibleSeq++);
  const ranks = keyFn ? competitionRanks(rows, keyFn) : rows.map((_, i) => i + 1);
  const top = rows.slice(0, topN);
  const rest = rows.slice(topN);
  let html = `<div style="overflow-x:auto;"><table>${headHtml}<tbody>`;
  top.forEach((r, i) => { html += rowFn(r, ranks[i]); });
  html += '</tbody></table></div>';
  if (rest.length > 0) {
    html += `<div class="collapsible-toggle" data-target="${uid}" style="margin:6px 0 4px; cursor:pointer; color:var(--text-dim); font-size:0.74rem; display:flex; align-items:center; gap:6px;">
      <span class="collapsible-arrow">▶</span><span data-show-text="他${rest.length}件を表示">他${rest.length}件を表示</span>
    </div>`;
    html += `<div id="${uid}" class="hidden"><div style="overflow-x:auto;"><table>${headHtml}<tbody>`;
    rest.forEach((r, i) => { html += rowFn(r, ranks[topN + i]); });
    html += '</tbody></table></div></div>';
  }
  return html;
}
// 折りたたみトグルの開閉は委譲で一括処理（動的に増える要素にも対応できる）
document.addEventListener('click', (e) => {
  const toggle = e.target.closest('.collapsible-toggle');
  if (!toggle) return;
  const body = document.getElementById(toggle.dataset.target);
  if (!body) return;
  const arrow = toggle.querySelector('.collapsible-arrow');
  const label = toggle.querySelector('span:last-child');
  const isHidden = body.classList.toggle('hidden');
  arrow.textContent = isHidden ? '▶' : '▼';
  label.textContent = isHidden ? label.dataset.showText : '閉じる';
});

// 殿堂タブ内の副タブ。1回のAPI取得結果をキャッシュし、切り替え時は再取得せず表示だけ差し替える。
// 従来はElo・タイトル数・対局数・勝利数・負け数・勝率が別々のサブタブ（＝別々の上位N件）だったが、
// 同じ人物でも指標ごとに対象集合が揃わず不便なため、1つの並び替え可能な表（ranking）に統合した
const HOF_VIEWS = ['ranking', 'matchup', 'retired', 'awakened'];
const HOF_VIEW_LABELS = {
  ranking: '総合ランキング', matchup: '同一カード対戦', retired: '引退者一覧', awakened: '覚醒個体一覧',
};
let _hofActiveView = 'ranking';
let _hofData = null;
// 総合ランキング表の並び替え状態（列ヘッダクリックで変更）。dirは-1が降順、1が昇順
let _hofRankingSort = { key: 'peak_elo', dir: -1 };

async function loadHallOfFame() {
  const el = document.getElementById('hof-content');

function renderHofPanel() {

function renderHofView(el, view) {
  const hofData = _hofData.hof, retiredData = _hofData.retired, awakenedData = _hofData.awakened;
  let html = '';

  if (view === 'ranking') {
    // Elo・対局数・勝敗・勝率・タイトル数を1つの表にまとめ、列ヘッダクリックで並び替える
    // （以前は指標ごとに別サブタブ＝別々の上位N件で、同じ人物でも指標間の対象集合が揃わなかった）
    const ranking = hofData.ranking || [];
    if (ranking.length === 0) {
      html = '<div class="empty">まだ記録がありません</div>';
    } else {
      const cols = [
        { key: 'dan', label: '段位' },
        { key: 'peak_elo', label: '最高Elo' },
        { key: 'elo', label: '現在Elo' },
        { key: 'total', label: '対局数' },
        { key: 'win', label: '勝数' },
        { key: 'loss', label: '敗数' },
        { key: 'win_rate', label: '勝率' },
        { key: 'title_count', label: 'タイトル' },
      ];
      const sort = _hofRankingSort;
      const sorted = ranking.slice().sort((a, b) => {
        const av = (a[sort.key] === null || a[sort.key] === undefined) ? -Infinity : a[sort.key];
        const bv = (b[sort.key] === null || b[sort.key] === undefined) ? -Infinity : b[sort.key];
        return (av - bv) * sort.dir;
      });
      const arrow = (key) => key === sort.key ? (sort.dir === -1 ? ' ▼' : ' ▲') : '';
      const headHtml = `<thead><tr><th>#</th><th>名前</th>${
        cols.map(c => `<th class="hof-sort-th" data-sort-key="${c.key}" style="cursor:pointer; white-space:nowrap;">${c.label}${arrow(c.key)}</th>`).join('')
      }</tr></thead>`;
      const cellFor = (p, key) => {
        if (key === 'dan') return `<span class="chip cyan">${danLabel(p.dan)}</span>`;
        if (key === 'peak_elo') return `${Math.round(p.peak_elo)}`;
        if (key === 'elo') return `${Math.round(p.elo)}`;
        if (key === 'total') return `${p.total}局`;
        if (key === 'win') return `${p.win}勝`;
        if (key === 'loss') return `${p.loss}敗`;
        if (key === 'win_rate') return p.win_rate === null ? '-' : p.win_rate.toFixed(3);
        if (key === 'title_count') return p.title_count > 0 ? `<span class="chip gold">${p.title_count}期</span>` : '-';
        return '';
      };
      const rowFn = (p, rank) => {
        const ageNote = (p.age !== null && p.age !== undefined) ? `<span style="color:var(--text-dim); font-size:0.68rem;">（${p.age}歳）</span>` : '';
        return `<tr data-id="${escapeHtml(p.id)}"><td class="rank-num">${rank}</td>
          <td>${eternalIcon(p.eternal_titles)}${escapeHtml(p.display_name)}${ageNote}${p.retired ? '<span style="color:var(--text-dim); font-size:0.68rem;">（引退）</span>' : ''}</td>
          ${cols.map(c => `<td${c.key === sort.key ? ' style="color:var(--amber);"' : ''}>${cellFor(p, c.key)}</td>`).join('')}</tr>`;
      };
      html = `<div style="font-size:0.68rem; color:var(--text-dim); margin-bottom:6px;">列見出しをクリックすると並び替え（勝率は${hofData.min_games_for_rate}対局以上が対象）</div>`;
      html += renderCollapsibleTable(headHtml, sorted, rowFn, 15);
    }
  } else if (view === 'matchup') {
    const byMatchup = hofData.by_matchup || [];
    if (byMatchup.length === 0) {
      html = '<div class="empty">まだ記録がありません</div>';
    } else {
      // 勝数が多い方を左側に配置済み（api.php側で並べ替え済み）
      const headHtml = '<thead><tr><th>#</th><th>対戦カード</th><th>成績</th><th>対戦数</th></tr></thead>';
      const rowFn = (m, rank) => {
        const drawNote = m.draw > 0 ? `（引分${m.draw}）` : '';
        return `<tr><td class="rank-num">${rank}</td>
          <td>${escapeHtml(m.display_name_a)}${m.retired_a ? '<span style="color:var(--text-dim); font-size:0.68rem;">（引退）</span>' : ''}
            <span style="color:var(--text-dim);">vs</span>
            ${escapeHtml(m.display_name_b)}${m.retired_b ? '<span style="color:var(--text-dim); font-size:0.68rem;">（引退）</span>' : ''}</td>
          <td style="font-size:0.76rem; white-space:nowrap;">${m.win_a}勝${m.win_b}敗${drawNote}</td>
          <td>${m.count}回</td></tr>`;
      };
      html = renderCollapsibleTable(headHtml, byMatchup, rowFn, 15, m => m.count);
    }
  } else if (view === 'retired') {
    // 引退者一覧はタイトル獲得数順（APIが既にソート済み）。elo・成績は表示せず、できるだけコンパクトにする
    const retired = retiredData.retired || [];
    if (retired.length === 0) {
      html = '<div class="empty">まだ引退者はいません</div>';
    } else {
      const headHtml = '<thead><tr><th>名前</th><th>段位</th><th>在籍</th><th>タイトル</th></tr></thead>';
      const rowFn = r => {
        const ageNote = (r.retired_age !== null && r.retired_age !== undefined) ? `<span style="color:var(--text-dim); font-size:0.68rem;">（引退時${r.retired_age}歳）</span>` : '';
        return `<tr data-id="${escapeHtml(r.id)}">
          <td>${eternalIcon(r.eternal_titles)}${escapeHtml(r.display_name)}${ageNote}</td>
          <td><span class="chip cyan">${danLabel(r.dan)}</span></td>
          <td style="font-size:0.72rem; color:var(--text-dim);">${r.debut_season}-${r.retired_season}</td>
          <td>${r.title_count > 0 ? `<span class="chip gold">${r.title_count}期</span>` : '-'}</td></tr>`;
      };
      html = renderCollapsibleTable(headHtml, retired, rowFn, 20);
    }
  } else if (view === 'awakened') {
    const awakened = awakenedData.awakened || [];
    if (awakened.length === 0) {
      html = '<div class="empty">まだ覚醒した個体はいません</div>';
    } else {
      const headHtml = '<thead><tr><th>名前</th><th>Elo</th><th>覚醒パラメータ</th></tr></thead>';
      const rowFn = a => `<tr data-id="${escapeHtml(a.id)}">
          <td>${leagueTag(a.league)}${escapeHtml(a.display_name)}</td>
          <td class="elo-val">${Math.round(a.elo_rating)}</td>
          <td style="color:var(--amber);">★ ${escapeHtml(paramLabel(a.awakened_param))}</td>
        </tr>`;
      html = renderCollapsibleTable(headHtml, awakened, rowFn, 15);
    }
  }

  el.innerHTML = html;
  el.querySelectorAll('tr[data-id]').forEach(tr => tr.addEventListener('click', () => navigateTo('individual/' + tr.dataset.id)));
  el.querySelectorAll('th.hof-sort-th').forEach(th => th.addEventListener('click', () => {
    const key = th.dataset.sortKey;
    if (_hofRankingSort.key === key) {
      _hofRankingSort.dir *= -1;
    } else {
      _hofRankingSort = { key, dir: -1 };
    }
    renderHofView(el, 'ranking');
  }));
}

function rulesHtml() {
  return `
    <h3 style="font-size:0.85rem; color:var(--cyan); margin-top:0;">リーグ制度</h3>
    <div style="font-size:0.8rem; line-height:1.7; margin-bottom:16px;">
      A（8名・総当たり）／B（12名）・C（16名）・D（20名）（スイス方式）の4部制。<br>
      A⇄B：下位2名⇄上位2名を毎季入れ替え。B⇄C：下位3名⇄上位3名を毎季入れ替え。<br>
      C⇄D：下位3名⇄上位3名を毎季入れ替え。<br>
      引き分けは先後を入れ替えて再戦、決着がつくまで繰り返す（実質上限あり。決着した最後の1局だけが結果になる）。<br>
      表示上の並び順は「直近シーズンの順位を継承」：残留者はその順位のまま、昇格者は昇格先の最下位、降格者は降格先の最上位から始まる。
    </div>

    <h3 style="font-size:0.85rem; color:var(--cyan);">一門と弟子</h3>
    <div style="font-size:0.8rem; line-height:1.7; margin-bottom:16px;">
      新弟子は師弟制：Dリーグの空き枠数ぶん、現役個体から選ばれた「師匠」1人ごとに、
      そのパラメータを変異（±15%程度）させた弟子が1人入門する（2個体の交配ではない）。
      師匠になれるのは30歳以上の個体のみ。<br>
      師匠選びはランダムだが、Elo・タイトル保持で重み付けされており、実力のある個体ほど
      弟子を持ちやすい（強い一門ほど自然と勢力を伸ばしやすい）。<br>
      一門は、最も遡った開祖を根とする師弟の系譜のまとまり。通常は弟子も師匠と同じ一門に属するが、
      稀（8%）に弟子自身が新しい一門の開祖として分岐することがあり、そこから新たな一門が生まれる。
      さらに稀（3%）に、師匠を持たず完全にランダムな能力の新規開祖が参入することもある
      （既存の血統に対抗できるよう、通常の新弟子よりやや高めの能力値で生成される）。<br>
      稀（3%）に、新弟子の誰かが「覚醒」し、1パラメータが通常の変異幅を超えて大きく伸びることがある。
      覚醒した個体は「神童」の扱いとして、通常（18〜24歳）より若い14〜16歳で参入する。<br>
      新人タブの「キャラクリエイト」から、名前とタイプ傾向を指定して新規開祖を1体リクエストできる
      （1回あたり最大40名まで）。本戦・新人リーグとも<b>1日2回、本戦→新人リーグの順</b>で
      実行しており、締め切りと反映は以下の通り。<br>
      ・<b>7:00(JST)までのエントリー</b> → 7:00の新人リーグで選抜（朝6:00の本戦で確定した欠員を募集） →
      <b>夜18:00の本戦から</b>Dリーグ入り・実際に対局を始める<br>
      ・<b>7:00〜19:00(JST)のエントリー</b> → 19:00の新人リーグで選抜（夜18:00の本戦で確定した欠員を募集） →
      <b>翌朝6:00の本戦から</b>Dリーグ入り・実際に対局を始める<br>
      （新人リーグは、直前の本戦で確定したばかりのDリーグの欠員数をそのまま募集人数として使い、
      次の本戦でその欠員へそのまま入って対局するため、選抜と初対局の間にズレはない）
    </div>

    <h3 style="font-size:0.85rem; color:var(--cyan);">引退</h3>
    <div style="font-size:0.8rem; line-height:1.7; margin-bottom:16px;">
      年齢（初期年齢＋通算シーズン数）が60歳に達すると、リーグを問わず強制引退する。<br>
      Dリーグは「2シーズン連続で負け越すと、実力・在籍年数に関わらず即引退」というup-or-out制。<br>
      C・Dリーグで定員を超えた場合、Eloが低い順に引退となる。<br>
      いずれの引退条件も、タイトルを1つでも保持している間は猶予され、全て失冠するまで引退しない。
    </div>

    <h3 style="font-size:0.85rem; color:var(--cyan);">タイトル戦</h3>
    <div style="font-size:0.8rem; line-height:1.7; margin-bottom:16px;">
      <b>青龍</b>（名人モデル）：Aリーグ総当たり優勝者が挑戦。7局制4本先取。<br>
      　青龍在位者はAリーグの総当たり（順位戦）を免除される防衛専念枠で、翌季もAリーグ1位として扱われる。<br><br>
      <b>朱雀</b>（王位モデル）：紅組・白組（各5名）の永続サブリーグ制。<br>
      　毎季、紅組・白組それぞれで総当たりを行い、両組1位同士の挑戦者決定戦（5局制3本先取）で朱雀への挑戦者を決める。
      　その挑戦者が朱雀在位者（5局制3本先取）に挑む。<br>
      　両組の下位2名（計4名）はリーグから陥落し、リーグ外の全所属個体（A〜D全リーグ、王位＝朱雀リーグ在籍者を除く）による
      　4ブロックの入れ替えトーナメント（タイトル保持者＞Aリーグ順位＞Eloの順でシード）で補充する。<br>
      　残留メンバーは紅白の組分けを毎季ランダムに組み直す（通常、各組は残留3名＋新規2名の計5名になる）。<br>
      　紅白リーグがまだ無い第1季のみ、上記と同じ仕組みの10ブロックの抽選トーナメントで初代メンバー10名を選出し、紅白5名ずつに振り分ける。<br><br>
      <b>白虎</b>（王将モデル）：Elo上位16名による正式シード付きトーナメント。5局制3本先取。<br>
      　前年白虎在位者は防衛専念枠として母集団から除外され、防衛のみに専念する。<br>
      　シードは標準的なトーナメント配置（1位×16位のように、上位ほど互いに離れた山に入る）。<br><br>
      <b>玄武</b>：ほぼ全所属個体が参加する抽選トーナメント（超早指し戦）。5局制3本先取。<br>
      　ブラケットサイズは64。Elo上位者から「64－参加人数」分だけ1回戦不戦勝（2回戦から登場）となり、各山に均等配置される。<br>
      　残りの参加者は完全ランダムに1回戦を組む。前年玄武在位者は防衛専念枠として母集団から除外される。<br>
      　表示上は64枠を8ブロック（各8名）に分け、各ブロックの優勝者8名がさらに挑戦者決定トーナメントを行って最終的な挑戦者を1名決める（対局・抽選の仕組み自体は従来通りで、見せ方を分けているだけ）。<br><br>
      各タイトルとも、初代不在の場合は挑戦者がそのまま無条件で襲名する。在位者が予選のどのスロットに入っても、
      自己対戦にならないよう自動的に不戦勝扱いになる。朱雀在位者は紅白リーグの総当たりを免除される防衛専念枠で、
      挑戦者決定戦で敗れた側の元1位は通常通り残留扱いとなる。<br><br>
      なお、探索深さは順位戦・タイトル戦を問わず、運用上すべて1に統一している。
    </div>

    <h3 style="font-size:0.85rem; color:var(--cyan);">永世称号</h3>
    <div style="font-size:0.8rem; line-height:1.7;">
      タイトルごとに基準が異なる。<br>
      ・永世青龍：通算5期保持（連続していなくてもよい）<br>
      ・永世朱雀：連続5期保持、または通算10期保持<br>
      ・永世白虎：連続5期保持<br>
      ・永世玄武：通算10期保持（連続していなくてもよい）<br>
      一度獲得すると、その後タイトルを失っても称号は残る。
    </div>

    <h3 style="font-size:0.85rem; color:var(--cyan);">段位</h3>
    <div style="font-size:0.8rem; line-height:1.7;">
      新規のデータは持たず、既存の対局結果・リーグ経験・タイトル実績から算出する表示専用の指標。
      新人は4段からスタートし、以下のうち最も高いものが最終的な段位になる（一度上がった段位は下がらない）。<br>
      ・通算勝数（タイトル戦を含む全対局）：30勝で5段、以降70／120／190／290勝で6～9段<br>
      ・経験リーグ：Cリーグ経験で5段、Bリーグ経験で6段、Aリーグ経験で7段<br>
      ・タイトル実績：青龍通算1期、または他タイトル（朱雀・白虎・玄武）通算2期以上で8段。
      いずれかの永世称号を獲得すると9段<br>
      引退者も引退時点の段位をそのまま表示する。
    </div>
  `;
}

const CHARACTER_TYPE_LABELS = {
  balanced: 'バランス型', aggressive: '攻撃型', defensive: '守備型', corner: '隅重視型',
};
// Python側（othello_league/league.py）のPARAM_KEYS・CHARACTER_PARAM_MIN/MAX/BUDGETと一致させること
const CC_PARAM_KEYS = [
  'corner_weight', 'danger_zone_weight', 'mobility_weight', 'edge_stability_weight',
  'frontier_weight', 'disc_weight', 'parity_weight', 'center_weight',
];
const CC_PARAM_MIN = 0.1, CC_PARAM_MAX = 10, CC_PARAM_BUDGET = 40;
// タイプ傾向ごとの目安の割り振り（「ランダムに割り振る」の初期値・傾向づけに使う簡易版）
const CC_TYPE_BOOST_KEYS = {
  balanced: [], aggressive: ['mobility_weight', 'frontier_weight'],
  defensive: ['edge_stability_weight', 'danger_zone_weight'], corner: ['corner_weight', 'center_weight'],
};

async function loadNewcomerLeague(forSeason) {
  const el = document.getElementById('newcomer-content');
  el.innerHTML = '<div class="loading">読み込み中...</div>';
  try {
    const url = forSeason ? `${API_BASE}?action=newcomer_league&for_season=${forSeason}` : `${API_BASE}?action=newcomer_league`;
    const resData = await fetch(url).then(r => r.json());

    if (!resData.for_season || !resData.meta) {
      el.innerHTML = '<div class="empty">まだ新人リーグの結果がありません（1日2回、7:00・19:00 JSTに実施）</div>';
      return;
    }

    const seasons = resData.available_seasons || [];
    const idx = seasons.indexOf(resData.for_season);
    const prevSeason = idx >= 0 && idx + 1 < seasons.length ? seasons[idx + 1] : null;
    const nextSeason = idx > 0 ? seasons[idx - 1] : null;

    let html = `<div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
      <button id="newcomer-prev" ${prevSeason ? '' : 'disabled'} style="background:var(--navy-800); color:var(--cyan); border:1px solid var(--navy-700); padding:4px 10px; cursor:pointer;">◀ 前回</button>
      <div style="font-size:0.8rem; color:var(--text-dim);">第${resData.for_season}季 新人リーグ（応募${resData.meta.submission_count}名 / 昇格枠${resData.meta.slots_needed}名・昇格者は第${resData.for_season}季からDリーグ出走）</div>
      <button id="newcomer-next" ${nextSeason ? '' : 'disabled'} style="background:var(--navy-800); color:var(--cyan); border:1px solid var(--navy-700); padding:4px 10px; cursor:pointer;">次回 ▶</button>
    </div>`;

    if (resData.standings.length === 0) {
      html += '<div class="empty">出走者データがありません</div>';
    } else {
      html += `<table><thead><tr><th>#</th><th>名前</th><th>成績</th><th></th></tr></thead><tbody>`;
      resData.standings.forEach(s => {
        const tags = [];
        if (s.promoted) tags.push('<span style="display:inline-block; font-size:0.62rem; color:var(--navy-950); background:var(--cyan); border-radius:2px; padding:1px 5px; margin-right:4px; font-weight:700;">昇格</span>');
        if (s.auto_generated) tags.push('<span style="display:inline-block; font-size:0.62rem; color:var(--text-dim); border:1px solid var(--navy-700); border-radius:2px; padding:1px 5px;">自動生成</span>');
        // 新人リーグ在籍中の個体は仮IDのため、本戦で実際にDリーグへ昇格し実IDが確認できた
        // 場合（real_individual_id）のみクリック可能にする。落選者・未昇格の間はリンクしない
        const idAttr = s.real_individual_id ? ` data-id="${escapeHtml(s.real_individual_id)}"` : '';
        const rowStyle = s.promoted ? 'background:rgba(79,240,255,0.06);' : '';
        html += `<tr${idAttr} style="${rowStyle}${s.real_individual_id ? '' : ' cursor:default;'}">
          <td class="rank-num">${s.rank ?? '-'}</td>
          <td>${escapeHtml(s.display_name || s.individual_id)}</td>
          <td>${s.win}勝${s.loss}敗${s.draw}分</td>
          <td>${tags.join('')}</td>
        </tr>`;
      });
      html += '</tbody></table>';
    }

    el.innerHTML = html;
    el.querySelectorAll('tr[data-id]').forEach(tr => tr.addEventListener('click', () => navigateTo('individual/' + tr.dataset.id)));
    if (prevSeason) document.getElementById('newcomer-prev').addEventListener('click', () => navigateTo('newcomer/' + prevSeason));
    if (nextSeason) document.getElementById('newcomer-next').addEventListener('click', () => navigateTo('newcomer/' + nextSeason));
  } catch (e) {
    el.innerHTML = `<div class="empty">読み込み失敗: ${escapeHtml(String(e))}</div>`;
  }
}

  const typeTip = 'バランス型：全パラメータを均等に配分。攻撃型：着手可能数（機動力）を重視。守備型：確定石（辺の安定度）を重視。隅重視型：角の確保と危険マスの回避を重視。';

        style="width:64px; background:var(--navy-800); color:var(--text-main); border:1px solid var(--navy-700); padding:2px 4px;">

    <div style="font-size:0.7rem; color:var(--text-dim); margin-bottom:10px;">締め切りは1日2回（7:00／19:00 JST）。新人リーグで選抜されれば、次の本戦からすぐ出走します</div>
    <div class="params-grid" style="margin-bottom:10px;">

      <dt>タイプ傾向${infoIcon(typeTip)}</dt>

function renderPendingMembersList(list) {
  let html = `<h3 style="font-size:0.8rem; color:var(--amber); border-bottom:1px solid var(--navy-700); padding-bottom:4px; margin-bottom:8px;">待機メンバー（${list.length}名）</h3>`;
  if (list.length === 0) {
    html += '<div class="empty">現在、待機中のエントリーはありません</div>';
  } else {
    html += `<table><thead><tr><th>#</th><th>名前</th><th>タイプ</th></tr></thead><tbody>`;
    list.forEach((p, i) => {
      html += `<tr style="cursor:default;">
        <td class="rank-num">${i + 1}</td>
        <td>${escapeHtml(p.display_name)}</td>
        <td>${escapeHtml(CHARACTER_TYPE_LABELS[p.type_tendency] || p.type_tendency)}</td>
      </tr>`;
    });
    html += '</tbody></table>';
  }
  return html;
}

function bindCharacterEntryForm() {
  const btn = document.getElementById('cc-submit');
  if (!btn || btn.disabled) return;

  const advToggle = document.getElementById('cc-advanced-toggle');
  const advancedEl = document.getElementById('cc-advanced');
  const totalEl = document.getElementById('cc-total');
  const paramInputs = Array.from(document.querySelectorAll('.cc-param'));

  function updateTotal() {
    const total = paramInputs.reduce((sum, inp) => sum + (parseFloat(inp.value) || 0), 0);
    totalEl.textContent = total.toFixed(1);
    totalEl.style.color = total > CC_PARAM_BUDGET ? '#ff9d4f' : 'var(--cyan)';
  }
  paramInputs.forEach(inp => inp.addEventListener('input', updateTotal));
  updateTotal();

  if (advToggle) {
    advToggle.addEventListener('change', () => {
      advancedEl.classList.toggle('hidden', !advToggle.checked);
    });
  }

  const randomizeBtn = document.getElementById('cc-randomize');
  if (randomizeBtn) {
    randomizeBtn.addEventListener('click', () => {
      const typeEl = document.getElementById('cc-type');
      const boosted = new Set(CC_TYPE_BOOST_KEYS[typeEl.value] || []);
      const raw = {};
      let total = 0;
      paramInputs.forEach(inp => {
        const v = boosted.has(inp.dataset.key) ? (2.5 + Math.random() * 5.5) : (0.5 + Math.random() * 4.5);
        raw[inp.dataset.key] = v;
        total += v;
      });
      const scale = total > 0 ? CC_PARAM_BUDGET / total : 1;
      paramInputs.forEach(inp => { inp.value = (raw[inp.dataset.key] * scale).toFixed(1); });
      updateTotal();
    });
  }

  btn.addEventListener('click', async () => {
    const nameEl = document.getElementById('cc-name');
    const typeEl = document.getElementById('cc-type');
    const statusEl = document.getElementById('cc-status');
    const name = nameEl.value.trim();
    if (!name) { statusEl.textContent = '名前を入力してください'; statusEl.style.color = 'var(--amber)'; return; }

    const body = { name, type: typeEl.value };
    if (advToggle && advToggle.checked) {
      const params = {};
      paramInputs.forEach(inp => { params[inp.dataset.key] = parseFloat(inp.value) || CC_PARAM_MIN; });
      body.params = params;
    }

    btn.disabled = true;
    statusEl.textContent = '送信中...';
    statusEl.style.color = 'var(--text-dim)';
    try {
      const res = await fetch('create_character.php', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body),
      });
      const data = await res.json();
      if (data.success) {
        statusEl.textContent = data.message;
        statusEl.style.color = 'var(--cyan)';
        nameEl.value = '';
        refreshCharacterCreationLists();
      } else {
        statusEl.textContent = data.error || '送信に失敗しました';
        statusEl.style.color = 'var(--amber)';
        btn.disabled = !!data.closed;
        if (data.closed) btn.textContent = '本日は締め切りました';
      }
    } catch (e) {
      statusEl.textContent = '送信に失敗しました: ' + String(e);
      statusEl.style.color = 'var(--amber)';
    } finally {
      if (!btn.textContent.includes('締め切りました')) btn.disabled = false;
    }
  });
}

async function loadNewcomerHistory() {
  const el = document.getElementById('newcomer_history-content');
  el.innerHTML = '<div class="loading">読み込み中...</div>';
  try {
    const data = await fetch(`${API_BASE}?action=newcomer_league_history`).then(r => r.json());
    const rows = data.history || [];
    if (rows.length === 0) {
      el.innerHTML = '<div class="empty">まだ新人リーグ経由での新規参入記録がありません</div>';
      return;
    }
    let html = `<h3 style="font-size:0.8rem; color:var(--amber); border-bottom:1px solid var(--navy-700); padding-bottom:4px; margin-bottom:8px;">新人リーグ経由 新規参入者（歴代）</h3>`;
    html += `<table><thead><tr><th>季</th><th>名前</th><th>成績</th><th></th></tr></thead><tbody>`;
    rows.forEach(r => {
      const tag = r.auto_generated ? '<span style="display:inline-block; font-size:0.62rem; color:var(--text-dim); border:1px solid var(--navy-700); border-radius:2px; padding:1px 5px;">自動生成</span>' : '';
      // real_individual_idが確認できた場合のみクリック可能にする（詳細はloadNewcomerLeague参照）
      const idAttr = r.real_individual_id ? ` data-id="${escapeHtml(r.real_individual_id)}"` : '';
      html += `<tr${idAttr}${r.real_individual_id ? '' : ' style="cursor:default;"'}>
        <td class="rank-num" style="cursor:default;">第${r.for_season}季</td>
        <td>${escapeHtml(r.display_name || r.individual_id)}</td>
        <td>${r.win}勝${r.loss}敗${r.draw}分</td>
        <td>${tag}</td>
      </tr>`;
    });
    html += '</tbody></table>';
    el.innerHTML = html;
    el.querySelectorAll('tr[data-id]').forEach(tr => tr.addEventListener('click', () => navigateTo('individual/' + tr.dataset.id)));
  } catch (e) {
    el.innerHTML = `<div class="empty">読み込み失敗: ${escapeHtml(String(e))}</div>`;
  }
}

render(location.hash);
</script>
</body>
</html>
