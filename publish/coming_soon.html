<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- 公開準備中に、データサイト・ファンサイトの index.html の代わりに置くページ（publish.yml の unpublish=true で配置、season=1 reset=true の始動で本来のページに戻す） -->
<title>サーキットオセロリーグ｜近日公開</title>
<meta name="description" content="AIの選手たちが毎日戦う架空のオセロ・プロリーグ。近日公開予定です。">
<meta name="robots" content="noindex">
<meta property="og:type" content="website">
<meta property="og:site_name" content="サーキットオセロリーグ">
<meta property="og:title" content="サーキットオセロリーグ｜近日公開">
<meta property="og:description" content="AIの選手たちが毎日戦う架空のオセロ・プロリーグ。近日公開予定です。">
<meta property="og:image" content="https://lab.spia-net.com/othello-league/ogp.png">
<meta name="twitter:card" content="summary_large_image">
<style>
:root{--bg:#f2f4f3;--surface:#fff;--ink:#1b2a22;--dim:#5c6b63;--green:#1b4332;--hi:#f2b632}
@media (prefers-color-scheme: dark){:root{--bg:#0f1a15;--surface:#16241d;--ink:#e6ede9;--dim:#9fb0a7;--green:#f2b632}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);
  font-family:"Hiragino Sans","Yu Gothic",system-ui,sans-serif;padding:24px 16px}
main{max-width:460px;width:100%;background:var(--surface);border-radius:14px;padding:32px 24px;text-align:center;
  box-shadow:0 2px 12px rgba(0,0,0,.06)}
.board{display:inline-grid;grid-template-columns:repeat(2,28px);gap:3px;background:#1a7f4b;padding:6px;border-radius:6px;margin-bottom:18px}
.board span{width:28px;height:28px;border-radius:50%}
.b{background:#111}.w{background:#f4f4f4}
h1{font-size:1.35rem;margin:0 0 6px;color:var(--green)}
.soon{display:inline-block;background:var(--hi);color:#1b2a22;font-weight:700;border-radius:999px;padding:4px 14px;font-size:.85rem;margin:6px 0 16px}
p{color:var(--dim);font-size:.9rem;line-height:1.8;margin:0}
</style>
</head>
<body>
<main>
  <div class="board" aria-hidden="true"><span class="w"></span><span class="b"></span><span class="b"></span><span class="w"></span></div>
  <h1>サーキットオセロリーグ</h1>
  <div class="soon">近日公開</div>
  <p>AIの選手たちが毎日戦う、架空のオセロ・プロリーグです。<br>選手は生まれ、育ち、タイトルを争い、やがて引退していきます。<br>公開まで、もうしばらくお待ちください。</p>
</main>
</body>
</html>
