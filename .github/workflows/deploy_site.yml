name: Deploy Site (index.html / api.php)

# site/配下（index.html・api.php）はxserver上の本番サイトの実体そのもの。従来は
# 手動でxserverへアップロードしていたが、このリポジトリで変更履歴を追えるようにするため
# site/配下にコミットし、mainへのpush（＝これらのファイルの変更を含むマージ）をきっかけに
# 自動でxserverへ反映する。
#
# 本戦・新人リーグ（evolve.yml / newcomer_league.yml）とは別の排他グループを使う：
# あちら側はdata/配下（matches・standings等）だけを扱い、こちらはsite/配下
# （index.html・api.php）だけを扱うので、同時に走っても書き込み先が重ならず競合しない。
# 短時間に連続でpushされた場合は、最新のpushだけを反映すれば十分なので
# cancel-in-progress: trueにしている
concurrency:
  group: deploy-othello-site
  cancel-in-progress: true

on:
  push:
    branches: [main]
    paths:
      - "site/index.html"
      - "site/api.php"
      - "site/create_character.php"
  workflow_dispatch:
    inputs:
      list_only:
        description: "trueにすると、デプロイせずxserverのサイト直下のファイル一覧を表示するだけで終わる"
        required: false
        default: "false"
      delete_files:
        description: "カンマ区切りのファイル名（サイト直下のみ、サブディレクトリ不可）を指定すると、デプロイの代わりにそのファイルだけ削除する。list_onlyでの確認後にのみ使うこと"
        required: false
        default: ""
      read_file:
        description: "サイト直下の1ファイル名を指定すると、デプロイの代わりにその内容をログに出力する（db_config.php等、認証情報を含みうるファイルには使わないこと）"
        required: false
        default: ""
      run_migration:
        description: "デプロイの代わりに、あらかじめ用意した固定のDBマイグレーションを1つ実行する（任意のSQLは実行できない）"
        required: false
        type: choice
        options:
          - ""
          - "add_submitter_name_column"
        default: ""
      create_dir:
        description: "デプロイの代わりに、lab.spia-net.com直下（othello-league/の1つ上）に相対パスでディレクトリを作成する（例: othello-news）。「..」や先頭「/」は不可"
        required: false
        default: ""

jobs:
  deploy-site:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Lint PHP before deploying
        if: ${{ github.event.inputs.list_only != 'true' && github.event.inputs.delete_files == '' && github.event.inputs.read_file == '' && github.event.inputs.run_migration == '' && github.event.inputs.create_dir == '' }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq php-cli
          php -l site/api.php
          php -l site/create_character.php

      - name: List / Delete / Deploy on xserver
        env:
          XSERVER_HOST: ${{ secrets.XSERVER_HOST }}
          XSERVER_USER: ${{ secrets.XSERVER_USER }}
          XSERVER_PORT: ${{ secrets.XSERVER_SSH_PORT }}
          XSERVER_SSH_KEY: ${{ secrets.XSERVER_SSH_KEY }}
          # data/配下（XSERVER_TARGET_DIR）の1つ上、サイトのドキュメントルート
          # （spia-net.com/public_html/lab.spia-net.com/othello-league/）
          XSERVER_SITE_DIR: "spia-net.com/public_html/lab.spia-net.com/othello-league/"
          # othello-league/の1つ上（lab.spia-net.com直下）。ニュースサイト等、
          # 結果サイトとは別のサブパスをここに新設する（create_dirの基準ディレクトリ）
          XSERVER_LAB_DIR: "spia-net.com/public_html/lab.spia-net.com/"
          LIST_ONLY: ${{ github.event.inputs.list_only }}
          DELETE_FILES: ${{ github.event.inputs.delete_files }}
          READ_FILE: ${{ github.event.inputs.read_file }}
          RUN_MIGRATION: ${{ github.event.inputs.run_migration }}
          CREATE_DIR: ${{ github.event.inputs.create_dir }}
        run: |
          echo "$XSERVER_SSH_KEY" > /tmp/deploy_key
          chmod 600 /tmp/deploy_key

          retry_cmd() {
            local max_attempts=4
            local delay=5
            local attempt=1
            until "$@"; do
              if [ "$attempt" -ge "$max_attempts" ]; then
                return 1
              fi
              echo "::warning::コマンド失敗（試行 $attempt/$max_attempts）。${delay}秒後にリトライします: $*"
              sleep "$delay"
              attempt=$((attempt + 1))
              delay=$((delay * 2))
            done
          }

          if [ "$LIST_ONLY" = "true" ]; then
            echo "=== ${XSERVER_SITE_DIR} 直下のファイル一覧 ==="
            retry_cmd ssh -i /tmp/deploy_key -p "$XSERVER_PORT" -o StrictHostKeyChecking=no -o ConnectTimeout=15 \
              "$XSERVER_USER@$XSERVER_HOST" "find '${XSERVER_SITE_DIR}' -maxdepth 1 -type f -printf '%f\t%s bytes\t%TY-%Tm-%Td\n' | sort"
            rm -f /tmp/deploy_key
            exit 0
          fi

          if [ -n "$READ_FILE" ]; then
            f="$(echo "$READ_FILE" | xargs)"
            if [[ -z "$f" || "$f" == *".."* || "$f" == *"/"* ]]; then
              echo "::error::不正なファイル名: '$f'"
              rm -f /tmp/deploy_key
              exit 1
            fi
            echo "=== ${f} の内容 ==="
            retry_cmd ssh -i /tmp/deploy_key -p "$XSERVER_PORT" -o StrictHostKeyChecking=no -o ConnectTimeout=15 \
              "$XSERVER_USER@$XSERVER_HOST" "cat -- '${XSERVER_SITE_DIR}${f}'"
            rm -f /tmp/deploy_key
            exit 0
          fi

          if [ -n "$RUN_MIGRATION" ]; then
            echo "=== マイグレーション実行: ${RUN_MIGRATION} ==="
            case "$RUN_MIGRATION" in
              add_submitter_name_column)
                # character_requestsに投稿者名（任意・表示専用）の列を追加する。
                # 既に存在する場合（エラー1060）は成功扱いにして再実行できるようにする。
                # db_config.phpの認証情報はサーバー上で完結させ、GitHub Actionsのログには一切出さない
                SQL='ALTER TABLE character_requests ADD COLUMN submitter_name VARCHAR(20) NULL AFTER display_name;'
                ;;
              *)
                echo "::error::未知のマイグレーション: ${RUN_MIGRATION}"
                rm -f /tmp/deploy_key
                exit 1
                ;;
            esac
            retry_cmd ssh -i /tmp/deploy_key -p "$XSERVER_PORT" -o StrictHostKeyChecking=no -o ConnectTimeout=15 \
              "$XSERVER_USER@$XSERVER_HOST" \
              "php -r '
                require \"${XSERVER_SITE_DIR}db_config.php\";
                \$pdo = league_db_connect();
                try {
                  \$pdo->exec(\"${SQL}\");
                  echo \"OK: 適用しました\n\";
                } catch (\PDOException \$e) {
                  if (\$e->getCode() === \"42S21\" || str_contains(\$e->getMessage(), \"Duplicate column\")) {
                    echo \"OK: 既に適用済みでした\n\";
                  } else {
                    throw \$e;
                  }
                }
              '"
            rm -f /tmp/deploy_key
            exit 0
          fi

          if [ -n "$CREATE_DIR" ]; then
            d="$(echo "$CREATE_DIR" | xargs)"
            # 英数字・ハイフン・アンダースコア・スラッシュのみ許可（コマンド注入・パストラバーサル対策）
            if [[ -z "$d" || ! "$d" =~ ^[A-Za-z0-9_/-]+$ || "$d" == *".."* || "$d" == /* ]]; then
              echo "::error::不正なディレクトリパス: '$d'"
              rm -f /tmp/deploy_key
              exit 1
            fi
            echo "=== ${XSERVER_LAB_DIR}${d} を作成 ==="
            retry_cmd ssh -i /tmp/deploy_key -p "$XSERVER_PORT" -o StrictHostKeyChecking=no -o ConnectTimeout=15 \
              "$XSERVER_USER@$XSERVER_HOST" "mkdir -pv -- '${XSERVER_LAB_DIR}${d}'"
            rm -f /tmp/deploy_key
            exit 0
          fi

          if [ -n "$DELETE_FILES" ]; then
            echo "=== 指定ファイルを削除 ==="
            IFS=',' read -ra FILES <<< "$DELETE_FILES"
            for f in "${FILES[@]}"; do
              # 前後の空白を除去。".."や"/"を含む・空のものはパストラバーサル対策としてスキップする
              f="$(echo "$f" | xargs)"
              if [[ -z "$f" || "$f" == *".."* || "$f" == *"/"* ]]; then
                echo "::warning::不正なファイル名のためスキップ: '$f'"
                continue
              fi
              echo "--- 削除: $f ---"
              retry_cmd ssh -i /tmp/deploy_key -p "$XSERVER_PORT" -o StrictHostKeyChecking=no -o ConnectTimeout=15 \
                "$XSERVER_USER@$XSERVER_HOST" "rm -fv -- '${XSERVER_SITE_DIR}${f}'"
            done
            rm -f /tmp/deploy_key
            exit 0
          fi

          retry_cmd ssh -i /tmp/deploy_key -p "$XSERVER_PORT" -o StrictHostKeyChecking=no -o ConnectTimeout=15 \
            "$XSERVER_USER@$XSERVER_HOST" "mkdir -p ${XSERVER_SITE_DIR}"

          retry_cmd scp -i /tmp/deploy_key -P "$XSERVER_PORT" -o StrictHostKeyChecking=no -o ConnectTimeout=15 \
            site/index.html site/api.php site/create_character.php \
            "$XSERVER_USER@$XSERVER_HOST:${XSERVER_SITE_DIR}"

          rm -f /tmp/deploy_key
