                  $id = $pdo->query("SELECT individual_a_id FROM matches GROUP BY individual_a_id ORDER BY COUNT(*) DESC LIMIT 1")->fetchColumn();
                  echo "--- 対局数の多い個体: $id ---" . PHP_EOL;
                  $qs = [
                    "or" => "SELECT individual_a_id, result FROM matches WHERE individual_a_id = ? OR individual_b_id = ?",
                    "or_join" => "SELECT m.individual_a_id, m.result, COALESCE(ia.display_name, ra.display_name) FROM matches m LEFT JOIN individuals ia ON ia.id = m.individual_a_id LEFT JOIN retired_archive ra ON ra.id = m.individual_a_id WHERE m.individual_a_id = ? OR m.individual_b_id = ?",
                    "recent30" => "SELECT m.id FROM matches m WHERE m.individual_a_id = ? OR m.individual_b_id = ? ORDER BY m.season DESC, m.id DESC LIMIT 30",
                  ];
                  foreach ($qs as $k => $q) {
                    foreach ($pdo->query("EXPLAIN " . str_replace("?", $pdo->quote($id), $q))->fetchAll(PDO::FETCH_ASSOC) as $e) {
                      echo "explain $k: table=" . $e["table"] . " type=" . $e["type"] . " key=" . ($e["key"] ?? "NULL") . " rows=" . $e["rows"] . " extra=" . ($e["Extra"] ?? "") . PHP_EOL;
                    }
