                PHP_QUERY='
                  echo "--- sponsors ---" . PHP_EOL;
                  $rows = $pdo->query("SELECT id, individual_id, display_name, message, amount_jpy, created_at FROM sponsors ORDER BY id")->fetchAll();
                  if (!$rows) { echo "(0件)" . PHP_EOL; }
                  foreach ($rows as $r) {
                    echo "id=" . $r["id"] . " individual_id=" . $r["individual_id"] . " display_name=" . $r["display_name"]
                      . " message=" . ($r["message"] ?? "") . " amount_jpy=" . $r["amount_jpy"] . " created_at=" . $r["created_at"] . PHP_EOL;
                  }
                  echo "--- permanent_sponsors ---" . PHP_EOL;
                  $rows = $pdo->query("SELECT individual_id, display_name, message, amount_jpy, created_at FROM permanent_sponsors ORDER BY created_at")->fetchAll();
                  if (!$rows) { echo "(0件)" . PHP_EOL; }
                  foreach ($rows as $r) {
                    echo "individual_id=" . $r["individual_id"] . " display_name=" . $r["display_name"]
                      . " message=" . ($r["message"] ?? "") . " amount_jpy=" . $r["amount_jpy"] . " created_at=" . $r["created_at"] . PHP_EOL;
                  }
                  echo "--- cheer_log（messageがある行のみ） ---" . PHP_EOL;
                  $rows = $pdo->query("SELECT individual_id, message, created_at FROM cheer_log WHERE message IS NOT NULL AND CHAR_LENGTH(message) > 0 ORDER BY created_at")->fetchAll();
                  if (!$rows) { echo "(0件)" . PHP_EOL; }
                  foreach ($rows as $r) {
                    echo "individual_id=" . $r["individual_id"] . " message=" . $r["message"] . " created_at=" . $r["created_at"] . PHP_EOL;
                  }
                '
                ;;
              inquiries)
                PHP_QUERY='
                  $rows = $pdo->query("SELECT id, category, message, contact, created_at FROM inquiries ORDER BY id DESC")->fetchAll();
                  if (!$rows) { echo "お問い合わせはまだありません" . PHP_EOL; }
                  foreach ($rows as $r) {
                    echo "#" . $r["id"] . " [" . $r["category"] . "] " . $r["created_at"] . PHP_EOL
                      . "  " . $r["message"] . PHP_EOL
                      . "  返信先: " . ($r["contact"] ?? "(なし)") . PHP_EOL;
                  }
                '
                ;;
              retirement_reasons)
                # 引退理由（retirement_reason）が記録されていない引退者を洗い出すための確認用
                PHP_QUERY='
                  $rows = $pdo->query("SELECT id, display_name, retired_season, retirement_reason FROM retired_archive ORDER BY retired_season DESC LIMIT 40")->fetchAll();
                  if (!$rows) { echo "retired_archiveにデータがありません" . PHP_EOL; }
                  foreach ($rows as $r) {
                    echo "season=" . ($r["retired_season"] ?? "?") . " id=" . $r["id"] . " display_name=" . $r["display_name"]
                      . " retirement_reason=" . ($r["retirement_reason"] ?? "(NULL)") . PHP_EOL;
                  }
                '
                ;;
              dup_check)
                # retired_archiveに移動済みの個体が、individualsテーブルにも古い行として
                # 残っていないか確認する（残っていると、api.phpのSELECT * FROM individuals側が
                # 先にヒットしてしまい、retired_archiveの情報（retirement_reason等）が一切
                # 返らなくなる不具合になる）
                PHP_QUERY='
                  $rows = $pdo->query(
                    "SELECT i.id, i.display_name FROM individuals i
                     INNER JOIN retired_archive r ON r.id = i.id"
                  )->fetchAll();
                  if (!$rows) { echo "individuals/retired_archiveの重複はありません" . PHP_EOL; }
                  foreach ($rows as $r) {
                    echo "id=" . $r["id"] . " display_name=" . $r["display_name"] . PHP_EOL;
                  }
                '
                ;;
              consistency_dump)
                # DBの個体データ（現役・引退）を1行1件のJSONで出力する。シミュレーション側の
