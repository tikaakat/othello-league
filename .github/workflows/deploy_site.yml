name: Deploy Site (index.html / api.php)

# site/配下（index.html・api.php・create_character.php・cheer.php・article_like.php・
# supporter.php・sponsor.php）はxserver上の
# 本番サイトの実体そのもの。従来は手動でxserverへアップロードしていたが、この
# リポジトリで変更履歴を追えるようにするため site/配下にコミットし、mainへのpush
# （＝これらのファイルの変更を含むマージ）をきっかけに自動でxserverへ反映する。
#
# 本戦・新人リーグ（evolve.yml / newcomer_league.yml）とは別の排他グループを使う：
# あちら側はdata/配下（matches・standings等）だけを扱い、こちらはsite/配下
# （index.html・api.php等）だけを扱うので、同時に走っても書き込み先が重ならず競合しない。
# 短時間に連続でpushされた場合は、最新のpushだけを反映すれば十分なので
# cancel-in-progress: trueにしている
concurrency:
  group: deploy-othello-site
  cancel-in-progress: true

on:
  push:
    branches: [main]
    paths:
      - "site/index.html"
      - "site/api.php"
      - "site/create_character.php"
      - "site/cheer.php"
      - "site/article_like.php"
      - "site/supporter.php"
      - "site/sponsor.php"
  workflow_dispatch:
    inputs:
      list_only:
        description: "trueにすると、デプロイせずxserverのサイト直下のファイル一覧を表示するだけで終わる"
        required: false
        default: "false"
      delete_files:
        description: "カンマ区切りのファイル名（サイト直下のみ、サブディレクトリ不可）を指定すると、デプロイの代わりにそのファイルだけ削除する。list_onlyでの確認後にのみ使うこと"
        required: false
        default: ""
      read_file:
        description: "サイト直下の1ファイル名を指定すると、デプロイの代わりにその内容をログに出力する（db_config.php等、認証情報を含みうるファイルには使わないこと）"
        required: false
        default: ""
      run_migration:
        description: "デプロイの代わりに、あらかじめ用意した固定のDBマイグレーションを1つ実行する（任意のSQLは実行できない）"
        required: false
        type: choice
        options:
          - ""
          - "add_submitter_name_column"
          - "add_cheer_feature"
          - "add_article_like_feature"
          - "add_supporter_feature"
          - "add_cheer_message"
          - "add_sponsor_feature"
          - "add_permanent_sponsor_feature"
          - "add_demotion_point_columns"
        default: ""
      create_dir:
        description: "デプロイの代わりに、lab.spia-net.com直下（othello-league/の1つ上）に相対パスでディレクトリを作成する（例: othello-news）。「..」や先頭「/」は不可"
        required: false
        default: ""

jobs:
  deploy-site:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Lint PHP before deploying
        if: ${{ github.event.inputs.list_only != 'true' && github.event.inputs.delete_files == '' && github.event.inputs.read_file == '' && github.event.inputs.run_migration == '' && github.event.inputs.create_dir == '' }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq php-cli
          php -l site/api.php
          php -l site/create_character.php

      - name: List / Delete / Deploy on xserver
        env:
          XSERVER_HOST: ${{ secrets.XSERVER_HOST }}
          XSERVER_USER: ${{ secrets.XSERVER_USER }}
          XSERVER_PORT: ${{ secrets.XSERVER_SSH_PORT }}
          XSERVER_SSH_KEY: ${{ secrets.XSERVER_SSH_KEY }}
          # data/配下（XSERVER_TARGET_DIR）の1つ上、サイトのドキュメントルート
          # （spia-net.com/public_html/lab.spia-net.com/othello-league/）
          XSERVER_SITE_DIR: "spia-net.com/public_html/lab.spia-net.com/othello-league/"
          # othello-league/の1つ上（lab.spia-net.com直下）。ニュースサイト等、
          # 結果サイトとは別のサブパスをここに新設する（create_dirの基準ディレクトリ）
          XSERVER_LAB_DIR: "spia-net.com/public_html/lab.spia-net.com/"
          LIST_ONLY: ${{ github.event.inputs.list_only }}
          DELETE_FILES: ${{ github.event.inputs.delete_files }}
          READ_FILE: ${{ github.event.inputs.read_file }}
          RUN_MIGRATION: ${{ github.event.inputs.run_migration }}
          CREATE_DIR: ${{ github.event.inputs.create_dir }}
        run: |
          echo "$XSERVER_SSH_KEY" > /tmp/deploy_key
          chmod 600 /tmp/deploy_key

          retry_cmd() {
            local max_attempts=4
            local delay=5
            local attempt=1
            until "$@"; do
              if [ "$attempt" -ge "$max_attempts" ]; then
                return 1
              fi
              echo "::warning::コマンド失敗（試行 $attempt/$max_attempts）。${delay}秒後にリトライします: $*"
              sleep "$delay"
              attempt=$((attempt + 1))
              delay=$((delay * 2))
            done
          }

          if [ "$LIST_ONLY" = "true" ]; then
            echo "=== ${XSERVER_SITE_DIR} 直下のファイル一覧 ==="
            retry_cmd ssh -i /tmp/deploy_key -p "$XSERVER_PORT" -o StrictHostKeyChecking=no -o ConnectTimeout=15 \
              "$XSERVER_USER@$XSERVER_HOST" "find '${XSERVER_SITE_DIR}' -maxdepth 1 -type f -printf '%f\t%s bytes\t%TY-%Tm-%Td\n' | sort"
            rm -f /tmp/deploy_key
            exit 0
          fi

          if [ -n "$READ_FILE" ]; then
            f="$(echo "$READ_FILE" | xargs)"
            if [[ -z "$f" || "$f" == *".."* || "$f" == *"/"* ]]; then
              echo "::error::不正なファイル名: '$f'"
              rm -f /tmp/deploy_key
              exit 1
            fi
            echo "=== ${f} の内容 ==="
            retry_cmd ssh -i /tmp/deploy_key -p "$XSERVER_PORT" -o StrictHostKeyChecking=no -o ConnectTimeout=15 \
              "$XSERVER_USER@$XSERVER_HOST" "cat -- '${XSERVER_SITE_DIR}${f}'"
            rm -f /tmp/deploy_key
            exit 0
          fi

          if [ -n "$RUN_MIGRATION" ]; then
            echo "=== マイグレーション実行: ${RUN_MIGRATION} ==="
            # SQL_LIST：このマイグレーションで実行する文（複数可。1文ずつ順に適用し、
            # 「既に存在する」系のエラー（列の重複・テーブルの重複）は成功扱いにして
            # 再実行できるようにする）。db_config.phpの認証情報はサーバー上で完結させ、
            # GitHub Actionsのログには一切出さない
            case "$RUN_MIGRATION" in
              add_submitter_name_column)
                # character_requestsに投稿者名（任意・表示専用）の列を追加する
                SQL_LIST=(
                  'ALTER TABLE character_requests ADD COLUMN submitter_name VARCHAR(20) NULL AFTER display_name;'
                )
                ;;
              add_cheer_feature)
                # 個体への「応援」機能：individuals/retired_archiveにcheer_count列を追加し、
                # IPハッシュ単位で1個体1日1回に制限するcheer_logテーブルを作る
                SQL_LIST=(
                  'ALTER TABLE individuals ADD COLUMN cheer_count INT NOT NULL DEFAULT 0;'
                  'ALTER TABLE retired_archive ADD COLUMN cheer_count INT NOT NULL DEFAULT 0;'
                  'CREATE TABLE IF NOT EXISTS cheer_log (individual_id VARCHAR(32) NOT NULL, ip_hash CHAR(64) NOT NULL, cheered_date DATE NOT NULL, PRIMARY KEY (individual_id, ip_hash, cheered_date));'
                )
                ;;
              add_article_like_feature)
                # news-siteの記事への「いいね」機能：記事はdata/news/articles.json側にしか
                # 無く個体のようなテーブル行が無いため、IPハッシュ単位で1記事1日1回に制限する
                # ログテーブルだけを作り、件数はCOUNT(*)で求める
                SQL_LIST=(
                  'CREATE TABLE IF NOT EXISTS article_likes (article_id VARCHAR(64) NOT NULL, ip_hash CHAR(64) NOT NULL, liked_date DATE NOT NULL, PRIMARY KEY (article_id, ip_hash, liked_date));'
                )
                ;;
              add_supporter_feature)
                # 応援ページ（無料・名前リスト版）：実際の金銭のやり取りは発生しない。
                # 名前（任意）だけを掲載するシンプルな一覧用のテーブル
                SQL_LIST=(
                  'CREATE TABLE IF NOT EXISTS supporters (id INT AUTO_INCREMENT PRIMARY KEY, display_name VARCHAR(30) NOT NULL, message VARCHAR(100) NULL, ip_hash CHAR(64) NOT NULL, created_at DATETIME NOT NULL DEFAULT CURRENT_TIMESTAMP);'
                )
                ;;
              add_cheer_message)
                # 個体への応援に、一言コメント（任意・匿名）を添えられるようにする。
                # created_atは応援コメント一覧を新しい順に出すための補助列
                # （cheered_dateは日付のみで同日分の順序を区別できないため）
                SQL_LIST=(
                  'ALTER TABLE cheer_log ADD COLUMN message VARCHAR(140) NULL;'
                  'ALTER TABLE cheer_log ADD COLUMN created_at DATETIME NOT NULL DEFAULT CURRENT_TIMESTAMP;'
                )
                ;;
              add_sponsor_feature)
                # 個体への有料支援（スポンサー）機能。決済自体はStripe側で行い、
                # Webhookで支払い成立を受け取った時点でこのテーブルに1行追加する想定
                # （このマイグレーションはテーブル作成のみで、決済連携は別途追加する）。
                # stripe_session_idはWebhookの重複配信に対する冪等キー（UNIQUE）。
                # amount_jpyは内部記録用（画面には金額は表示しない想定）。
                # seasonは支援が行われた時点のシーズン番号（将来、タイトル獲得時の
                # スポンサー表記に使う）。logo_urlは将来の顔写真/ロゴ表示用に先に確保しておく
                SQL_LIST=(
                  'CREATE TABLE IF NOT EXISTS sponsors (id INT AUTO_INCREMENT PRIMARY KEY, individual_id VARCHAR(32) NOT NULL, display_name VARCHAR(30) NOT NULL, message VARCHAR(100) NULL, amount_jpy INT NOT NULL, currency VARCHAR(8) NOT NULL DEFAULT "jpy", stripe_session_id VARCHAR(255) NOT NULL, season INT NULL, logo_url VARCHAR(255) NULL, created_at DATETIME NOT NULL DEFAULT CURRENT_TIMESTAMP, UNIQUE KEY uniq_stripe_session (stripe_session_id), INDEX idx_individual (individual_id));'
                )
                ;;
              add_permanent_sponsor_feature)
                # 永久スポンサー枠：1個体につき先着1名のみという希少性を、
                # individual_idをPRIMARY KEYにすることでDB側で保証する
                # （2人目の支払いが先着者と同じ個体に対して確定しても、INSERTが
                # 一意制約違反になるため、アプリ側の競合制御に頼らず済む）。
                # この枠はその個体が引退しても表示され続ける想定（永続的な記録として扱う）
                SQL_LIST=(
                  'CREATE TABLE IF NOT EXISTS permanent_sponsors (individual_id VARCHAR(32) PRIMARY KEY, display_name VARCHAR(30) NOT NULL, message VARCHAR(100) NULL, amount_jpy INT NOT NULL, stripe_session_id VARCHAR(255) NOT NULL, created_at DATETIME NOT NULL DEFAULT CURRENT_TIMESTAMP, UNIQUE KEY uniq_stripe_session (stripe_session_id));'
                )
                ;;
              add_demotion_point_columns)
                # Dリーグ降級点（individuals.demotion_points）は既にPythonの個体state
                # （rosters.json経由のインポート）で管理されている値だが、現時点では
                # individuals/retired_archiveテーブルに列が無いとSELECTできないため、
                # 保険的に追加する（既に列がある場合はDuplicate columnとして正常終了する）。
                # standings.demotion_point_eventは、run_season.py側で「この季に降級点が
                # 増えた(gained)／0に戻った(cleared)」をその季の行にだけ記録する新列
                # （結果タブ・リーグタブの「点」「消」簡易表示用）
                SQL_LIST=(
                  'ALTER TABLE individuals ADD COLUMN demotion_points INT NOT NULL DEFAULT 0;'
                  'ALTER TABLE retired_archive ADD COLUMN demotion_points INT NOT NULL DEFAULT 0;'
                  'ALTER TABLE standings ADD COLUMN demotion_point_event VARCHAR(16) NULL;'
                )
                ;;
              *)
                echo "::error::未知のマイグレーション: ${RUN_MIGRATION}"
                rm -f /tmp/deploy_key
                exit 1
                ;;
            esac
            # base64はシェルのメタ文字を含まないため、そのままリモートコマンド文字列に
            # 埋め込んでも引用符崩れの心配がない（複数文をNUL区切りで1回のSSH呼び出しに渡す）
            SQL_B64="$(printf '%s\0' "${SQL_LIST[@]}" | base64 -w0)"
            # SSH経由の既定の`php`（CLI用の古いバージョンのことが多い）はdb_config.phpの
            # 構文（戻り値型宣言など）を解釈できずPHP Parse errorになることがあるため、
            # Webサイト提供に使われているであろう新しめのバージョン別バイナリを順に探して使う
            # （xserverでは `php81`/`php82`のようにドット無しで提供されるのが一般的）
            retry_cmd ssh -i /tmp/deploy_key -p "$XSERVER_PORT" -o StrictHostKeyChecking=no -o ConnectTimeout=15 \
              "$XSERVER_USER@$XSERVER_HOST" \
              "PHP_BIN=\$(command -v php84 || command -v php83 || command -v php82 || command -v php81 || command -v php80 || command -v php74 || command -v php8.4 || command -v php8.3 || command -v php8.2 || command -v php8.1 || command -v php8.0 || command -v php7.4 || command -v php); \"\$PHP_BIN\" -r '
                require \"${XSERVER_SITE_DIR}db_config.php\";
                \$pdo = league_db_connect();
                \$list = array_filter(array_map(\"trim\", explode(\"\\0\", base64_decode(\"${SQL_B64}\"))));
                foreach (\$list as \$sql) {
                  try {
                    \$pdo->exec(\$sql);
                    echo \"OK: \" . substr(\$sql, 0, 60) . PHP_EOL;
                  } catch (\PDOException \$e) {
                    \$msg = \$e->getMessage();
                    if (strpos(\$msg, \"Duplicate column\") !== false || strpos(\$msg, \"already exists\") !== false) {
                      echo \"OK(既に適用済み): \" . substr(\$sql, 0, 60) . PHP_EOL;
                    } else {
                      throw \$e;
                    }
                  }
                }
              '"
            rm -f /tmp/deploy_key
            exit 0
          fi

          if [ -n "$CREATE_DIR" ]; then
            d="$(echo "$CREATE_DIR" | xargs)"
            # 英数字・ハイフン・アンダースコア・スラッシュのみ許可（コマンド注入・パストラバーサル対策）
            if [[ -z "$d" || ! "$d" =~ ^[A-Za-z0-9_/-]+$ || "$d" == *".."* || "$d" == /* ]]; then
              echo "::error::不正なディレクトリパス: '$d'"
              rm -f /tmp/deploy_key
              exit 1
            fi
            echo "=== ${XSERVER_LAB_DIR}${d} を作成 ==="
            retry_cmd ssh -i /tmp/deploy_key -p "$XSERVER_PORT" -o StrictHostKeyChecking=no -o ConnectTimeout=15 \
              "$XSERVER_USER@$XSERVER_HOST" "mkdir -pv -- '${XSERVER_LAB_DIR}${d}'"
            rm -f /tmp/deploy_key
            exit 0
          fi

          if [ -n "$DELETE_FILES" ]; then
            echo "=== 指定ファイルを削除 ==="
            IFS=',' read -ra FILES <<< "$DELETE_FILES"
            for f in "${FILES[@]}"; do
              # 前後の空白を除去。".."や"/"を含む・空のものはパストラバーサル対策としてスキップする
              f="$(echo "$f" | xargs)"
              if [[ -z "$f" || "$f" == *".."* || "$f" == *"/"* ]]; then
                echo "::warning::不正なファイル名のためスキップ: '$f'"
                continue
              fi
              echo "--- 削除: $f ---"
              retry_cmd ssh -i /tmp/deploy_key -p "$XSERVER_PORT" -o StrictHostKeyChecking=no -o ConnectTimeout=15 \
                "$XSERVER_USER@$XSERVER_HOST" "rm -fv -- '${XSERVER_SITE_DIR}${f}'"
            done
            rm -f /tmp/deploy_key
            exit 0
          fi

          retry_cmd ssh -i /tmp/deploy_key -p "$XSERVER_PORT" -o StrictHostKeyChecking=no -o ConnectTimeout=15 \
            "$XSERVER_USER@$XSERVER_HOST" "mkdir -p ${XSERVER_SITE_DIR}"

          retry_cmd scp -i /tmp/deploy_key -P "$XSERVER_PORT" -o StrictHostKeyChecking=no -o ConnectTimeout=15 \
            site/index.html site/api.php site/create_character.php site/cheer.php \
            site/article_like.php site/supporter.php \
            "$XSERVER_USER@$XSERVER_HOST:${XSERVER_SITE_DIR}"

          rm -f /tmp/deploy_key
