name: Deploy Site (index.html / api.php)

# site/配下（index.html・api.php・create_character.php・cheer.php・article_like.php・
# supporter.php・sponsor.php）はxserver上の
# 本番サイトの実体そのもの。従来は手動でxserverへアップロードしていたが、この
# リポジトリで変更履歴を追えるようにするため site/配下にコミットし、mainへのpush
# （＝これらのファイルの変更を含むマージ）をきっかけに自動でxserverへ反映する。
#
# 本戦・新人リーグ（evolve.yml / newcomer_league.yml）とは別の排他グループを使う：
# あちら側はdata/配下（matches・standings等）だけを扱い、こちらはsite/配下
# （index.html・api.php等）だけを扱うので、同時に走っても書き込み先が重ならず競合しない。
# 短時間に連続でpushされた場合は、最新のpushだけを反映すれば十分なので
# cancel-in-progress: trueにしている
concurrency:
  group: deploy-othello-site
  cancel-in-progress: true

on:
  push:
    branches: [main]
    paths:
      - "site/index.html"
      - "site/api.php"
      - "site/create_character.php"
      - "site/cheer.php"
      - "site/article_like.php"
      - "site/supporter.php"
      - "site/sponsor.php"
      - "site/stripe_client.php"
      - "site/create_checkout.php"
      - "site/stripe_webhook.php"
      - "site/inquiry.php"
  workflow_dispatch:
    inputs:
      list_only:
        description: "trueにすると、デプロイせずxserverのサイト直下のファイル一覧を表示するだけで終わる"
        required: false
        default: "false"
      delete_files:
        description: "カンマ区切りのファイル名（サイト直下のみ、サブディレクトリ不可）を指定すると、デプロイの代わりにそのファイルだけ削除する。list_onlyでの確認後にのみ使うこと"
        required: false
        default: ""
      read_file:
        description: "サイト直下の1ファイル名を指定すると、デプロイの代わりにその内容をログに出力する（db_config.php等、認証情報を含みうるファイルには使わないこと）"
        required: false
        default: ""
      run_migration:
        description: "デプロイの代わりに、あらかじめ用意した固定のDBマイグレーションを1つ実行する（任意のSQLは実行できない）"
        required: false
        type: choice
        options:
          - ""
          - "add_submitter_name_column"
          - "add_cheer_feature"
          - "add_article_like_feature"
          - "add_supporter_feature"
          - "add_cheer_message"
          - "add_sponsor_feature"
          - "add_permanent_sponsor_feature"
          - "add_demotion_point_columns"
          - "add_retirement_reason_columns"
          - "add_inquiry_feature"
          - "cleanup_test_sponsor_data_20261008"
          - "cleanup_stale_retired_individuals_rows_20261009"
          - "add_newcomer_master_columns"
          - "add_gender_column"
          - "reset_fan_site_data_20261011"
          - "fix_newcomer_standings_stale_master_20261011"
          - "fix_newcomer_standings_stale_master_round2_20261011"
          - "fix_demotion_won_event_20261012"
          - "fix_backfill_demotion_reset_20261012"
          - "sync_retired_clan_roots"
          - "fix_newcomer_duplicate_name_20261018"
          - "rename_numbered_names_20261027"
          - "fix_season_101_duplicates_20261028"
          - "patch_import_free_class_20261028"
          - "resync_server_data"
        default: ""
      create_dir:
        description: "デプロイの代わりに、lab.spia-net.com直下（othello-league/の1つ上）に相対パスでディレクトリを作成する（例: othello-news）。「..」や先頭「/」は不可"
        required: false
        default: ""
      run_import:
        description: "trueにすると、デプロイの代わりにサーバー上のimport_from_github.php（GitHub上のdata/配下→DB取り込み）をCLI実行する（DB列の追加だけでなく既存データの反映漏れを後から取り込みたい場合などに使う）"
        required: false
        default: "false"
      debug_query:
        description: "デプロイの代わりに、あらかじめ用意した固定の読み取り専用クエリを1つ実行して結果をログに出す（任意のSQLは実行できない）"
        required: false
        type: choice
        options:
          - ""
          - "demotion_points"
          - "sponsors"
          - "inquiries"
          - "retirement_reasons"
          - "dup_check"
          - "consistency_dump"
          - "schema_check"
          - "perf_check"
          - "season_check"
          - "import_rosters_check"
        default: ""

jobs:
  deploy-site:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Lint PHP before deploying
        if: ${{ github.event.inputs.list_only != 'true' && github.event.inputs.delete_files == '' && github.event.inputs.read_file == '' && github.event.inputs.run_migration == '' && github.event.inputs.create_dir == '' && github.event.inputs.run_import != 'true' && github.event.inputs.debug_query == '' }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq php-cli
          php -l site/api.php
          php -l site/create_character.php
          php -l site/stripe_client.php
          php -l site/create_checkout.php
          php -l site/stripe_webhook.php
          php -l site/inquiry.php

      - name: List / Delete / Deploy on xserver
        env:
          XSERVER_HOST: ${{ secrets.XSERVER_HOST }}
          XSERVER_USER: ${{ secrets.XSERVER_USER }}
          XSERVER_PORT: ${{ secrets.XSERVER_SSH_PORT }}
          XSERVER_SSH_KEY: ${{ secrets.XSERVER_SSH_KEY }}
          # data/配下（XSERVER_TARGET_DIR）の1つ上、サイトのドキュメントルート
          # （spia-net.com/public_html/lab.spia-net.com/othello-league/）
          XSERVER_SITE_DIR: "spia-net.com/public_html/lab.spia-net.com/othello-league/"
          # othello-league/の1つ上（lab.spia-net.com直下）。ニュースサイト等、
          # 結果サイトとは別のサブパスをここに新設する（create_dirの基準ディレクトリ）
          XSERVER_LAB_DIR: "spia-net.com/public_html/lab.spia-net.com/"
          LIST_ONLY: ${{ github.event.inputs.list_only }}
          DELETE_FILES: ${{ github.event.inputs.delete_files }}
          READ_FILE: ${{ github.event.inputs.read_file }}
          RUN_MIGRATION: ${{ github.event.inputs.run_migration }}
          CREATE_DIR: ${{ github.event.inputs.create_dir }}
          RUN_IMPORT: ${{ github.event.inputs.run_import }}
          DEBUG_QUERY: ${{ github.event.inputs.debug_query }}
        run: |
          echo "$XSERVER_SSH_KEY" > /tmp/deploy_key
          chmod 600 /tmp/deploy_key

          retry_cmd() {
            local max_attempts=4
            local delay=5
            local attempt=1
            until "$@"; do
              if [ "$attempt" -ge "$max_attempts" ]; then
                return 1
              fi
              echo "::warning::コマンド失敗（試行 $attempt/$max_attempts）。${delay}秒後にリトライします: $*"
              sleep "$delay"
              attempt=$((attempt + 1))
              delay=$((delay * 2))
            done
          }

          if [ "$LIST_ONLY" = "true" ]; then
            echo "=== ${XSERVER_SITE_DIR} 直下のファイル一覧 ==="
            retry_cmd ssh -i /tmp/deploy_key -p "$XSERVER_PORT" -o StrictHostKeyChecking=no -o ConnectTimeout=15 \
              "$XSERVER_USER@$XSERVER_HOST" "find '${XSERVER_SITE_DIR}' -maxdepth 1 -type f -printf '%f\t%s bytes\t%TY-%Tm-%Td\n' | sort"
            rm -f /tmp/deploy_key
            exit 0
          fi

          if [ -n "$READ_FILE" ]; then
            f="$(echo "$READ_FILE" | xargs)"
            if [[ -z "$f" || "$f" == *".."* || "$f" == *"/"* ]]; then
              echo "::error::不正なファイル名: '$f'"
              rm -f /tmp/deploy_key
              exit 1
            fi
            echo "=== ${f} の内容 ==="
            retry_cmd ssh -i /tmp/deploy_key -p "$XSERVER_PORT" -o StrictHostKeyChecking=no -o ConnectTimeout=15 \
              "$XSERVER_USER@$XSERVER_HOST" "cat -- '${XSERVER_SITE_DIR}${f}'"
            rm -f /tmp/deploy_key
            exit 0
          fi

          if [ -n "$RUN_MIGRATION" ]; then
            echo "=== マイグレーション実行: ${RUN_MIGRATION} ==="
            if [ "$RUN_MIGRATION" = "resync_server_data" ]; then
              # GitHub上の最新データ（rosters・軽量版season_state・matches・standings・新人リーグ）をサーバーへ送り直し、
              # 取り込み（import_from_colab.php）をCLIで実行する。季の本戦でサーバーへの反映が失敗したときの手動復旧用。
              # season_state.jsonは棋譜（games・bracket）を除いた軽量版を送る（元のままだとPHPのメモリ上限を超える。evolve.yml参照）
              mkdir -p /tmp/server_state
              python3 -c 'import json; s = json.load(open("data/season_state.json", encoding="utf-8")); s["title_history"] = [{k: v for k, v in e.items() if not isinstance(v, (list, dict))} for e in s.get("title_history", [])]; json.dump(s, open("/tmp/server_state/season_state.json", "w", encoding="utf-8"), ensure_ascii=False, separators=(",", ":"))'
              EXPORT="${XSERVER_SITE_DIR}league_export/"
              retry_cmd ssh -i /tmp/deploy_key -p "$XSERVER_PORT" -o StrictHostKeyChecking=no -o ConnectTimeout=15 \
                "$XSERVER_USER@$XSERVER_HOST" "mkdir -p ${EXPORT}matches ${EXPORT}standings ${EXPORT}newcomer_league"
              retry_cmd scp -i /tmp/deploy_key -P "$XSERVER_PORT" -o StrictHostKeyChecking=no -o ConnectTimeout=15 \
                data/rosters.json /tmp/server_state/season_state.json "$XSERVER_USER@$XSERVER_HOST:${EXPORT}"
              retry_cmd scp -i /tmp/deploy_key -P "$XSERVER_PORT" -o StrictHostKeyChecking=no -o ConnectTimeout=15 -r \
                data/matches/. "$XSERVER_USER@$XSERVER_HOST:${EXPORT}matches/"
              retry_cmd scp -i /tmp/deploy_key -P "$XSERVER_PORT" -o StrictHostKeyChecking=no -o ConnectTimeout=15 -r \
                data/standings/. "$XSERVER_USER@$XSERVER_HOST:${EXPORT}standings/"
              retry_cmd scp -i /tmp/deploy_key -P "$XSERVER_PORT" -o StrictHostKeyChecking=no -o ConnectTimeout=15 -r \
                data/newcomer_league/. "$XSERVER_USER@$XSERVER_HOST:${EXPORT}newcomer_league/"
              OUT=$(ssh -i /tmp/deploy_key -p "$XSERVER_PORT" -o StrictHostKeyChecking=no -o ConnectTimeout=15 \
                "$XSERVER_USER@$XSERVER_HOST" "cd '${XSERVER_SITE_DIR}' && php import_from_colab.php" 2>&1)
              echo "$OUT"
              rm -f /tmp/deploy_key
              echo "$OUT" | grep -q "インポート完了" || { echo "::error::取り込みが完了しませんでした"; exit 1; }
              exit 0
            fi
            if [ "$RUN_MIGRATION" = "patch_import_free_class_20261028" ]; then
              # フリークラス（rosters.jsonの"F"）の選手も現役としてindividualsへ取り込むよう、サーバー上の
              # 取り込みスクリプト（リポジトリ外）の現役ロスターのループに"F"を足す。元のファイルは .bak_20261028 に残す。
              # 何度実行しても同じ結果になる（既に"F"があれば変えない）
              retry_cmd ssh -i /tmp/deploy_key -p "$XSERVER_PORT" -o StrictHostKeyChecking=no -o ConnectTimeout=15 \
                "$XSERVER_USER@$XSERVER_HOST" "cd '${XSERVER_SITE_DIR}' && for f in import_from_github.php import_from_colab.php; do \
                  [ -f \$f ] || continue; [ -f \$f.bak_20261028 ] || cp -p \$f \$f.bak_20261028; \
                  sed -i 's/foreach (\[\"A\", \"B\", \"C\", \"D\"\] as \$league)/foreach ([\"A\", \"B\", \"C\", \"D\", \"F\"] as \$league)/' \$f; \
                  echo \"--- \$f ---\"; grep -n 'as \$league)' \$f; done"
              rm -f /tmp/deploy_key
              exit 0
            fi
            # SQL_LIST：このマイグレーションで実行する文（複数可。1文ずつ順に適用し、
            # 「既に存在する」系のエラー（列の重複・テーブルの重複）は成功扱いにして
            # 再実行できるようにする）。db_config.phpの認証情報はサーバー上で完結させ、
            # GitHub Actionsのログには一切出さない
            case "$RUN_MIGRATION" in
              add_submitter_name_column)
                # character_requestsに投稿者名（任意・表示専用）の列を追加する
                SQL_LIST=(
                  'ALTER TABLE character_requests ADD COLUMN submitter_name VARCHAR(20) NULL AFTER display_name;'
                )
                ;;
              add_cheer_feature)
                # 個体への「応援」機能：individuals/retired_archiveにcheer_count列を追加し、
                # IPハッシュ単位で1個体1日1回に制限するcheer_logテーブルを作る
                SQL_LIST=(
                  'ALTER TABLE individuals ADD COLUMN cheer_count INT NOT NULL DEFAULT 0;'
                  'ALTER TABLE retired_archive ADD COLUMN cheer_count INT NOT NULL DEFAULT 0;'
                  'CREATE TABLE IF NOT EXISTS cheer_log (individual_id VARCHAR(32) NOT NULL, ip_hash CHAR(64) NOT NULL, cheered_date DATE NOT NULL, PRIMARY KEY (individual_id, ip_hash, cheered_date));'
                )
                ;;
              add_article_like_feature)
                # news-siteの記事への「いいね」機能：記事はdata/news/articles.json側にしか
                # 無く個体のようなテーブル行が無いため、IPハッシュ単位で1記事1日1回に制限する
                # ログテーブルだけを作り、件数はCOUNT(*)で求める
                SQL_LIST=(
                  'CREATE TABLE IF NOT EXISTS article_likes (article_id VARCHAR(64) NOT NULL, ip_hash CHAR(64) NOT NULL, liked_date DATE NOT NULL, PRIMARY KEY (article_id, ip_hash, liked_date));'
                )
                ;;
              add_supporter_feature)
                # 応援ページ（無料・名前リスト版）：実際の金銭のやり取りは発生しない。
                # 名前（任意）だけを掲載するシンプルな一覧用のテーブル
                SQL_LIST=(
                  'CREATE TABLE IF NOT EXISTS supporters (id INT AUTO_INCREMENT PRIMARY KEY, display_name VARCHAR(30) NOT NULL, message VARCHAR(100) NULL, ip_hash CHAR(64) NOT NULL, created_at DATETIME NOT NULL DEFAULT CURRENT_TIMESTAMP);'
                )
                ;;
              add_cheer_message)
                # 個体への応援に、一言コメント（任意・匿名）を添えられるようにする。
                # created_atは応援コメント一覧を新しい順に出すための補助列
                # （cheered_dateは日付のみで同日分の順序を区別できないため）
                SQL_LIST=(
                  'ALTER TABLE cheer_log ADD COLUMN message VARCHAR(140) NULL;'
                  'ALTER TABLE cheer_log ADD COLUMN created_at DATETIME NOT NULL DEFAULT CURRENT_TIMESTAMP;'
                )
                ;;
              add_sponsor_feature)
                # 個体への有料支援（スポンサー）機能。決済自体はStripe側で行い、
                # Webhookで支払い成立を受け取った時点でこのテーブルに1行追加する想定
                # （このマイグレーションはテーブル作成のみで、決済連携は別途追加する）。
                # stripe_session_idはWebhookの重複配信に対する冪等キー（UNIQUE）。
                # amount_jpyは内部記録用（画面には金額は表示しない想定）。
                # seasonは支援が行われた時点のシーズン番号（将来、タイトル獲得時の
                # スポンサー表記に使う）。logo_urlは将来の顔写真/ロゴ表示用に先に確保しておく
                SQL_LIST=(
                  'CREATE TABLE IF NOT EXISTS sponsors (id INT AUTO_INCREMENT PRIMARY KEY, individual_id VARCHAR(32) NOT NULL, display_name VARCHAR(30) NOT NULL, message VARCHAR(100) NULL, amount_jpy INT NOT NULL, currency VARCHAR(8) NOT NULL DEFAULT "jpy", stripe_session_id VARCHAR(255) NOT NULL, season INT NULL, logo_url VARCHAR(255) NULL, created_at DATETIME NOT NULL DEFAULT CURRENT_TIMESTAMP, UNIQUE KEY uniq_stripe_session (stripe_session_id), INDEX idx_individual (individual_id));'
                )
                ;;
              add_permanent_sponsor_feature)
                # 永久スポンサー枠：1個体につき先着1名のみという希少性を、
                # individual_idをPRIMARY KEYにすることでDB側で保証する
                # （2人目の支払いが先着者と同じ個体に対して確定しても、INSERTが
                # 一意制約違反になるため、アプリ側の競合制御に頼らず済む）。
                # この枠はその個体が引退しても表示され続ける想定（永続的な記録として扱う）
                SQL_LIST=(
                  'CREATE TABLE IF NOT EXISTS permanent_sponsors (individual_id VARCHAR(32) PRIMARY KEY, display_name VARCHAR(30) NOT NULL, message VARCHAR(100) NULL, amount_jpy INT NOT NULL, stripe_session_id VARCHAR(255) NOT NULL, created_at DATETIME NOT NULL DEFAULT CURRENT_TIMESTAMP, UNIQUE KEY uniq_stripe_session (stripe_session_id));'
                )
                ;;
              add_demotion_point_columns)
                # Dリーグ降級点（individuals.demotion_points）は既にPythonの個体state
                # （rosters.json経由のインポート）で管理されている値だが、現時点では
                # individuals/retired_archiveテーブルに列が無いとSELECTできないため、
                # 保険的に追加する（既に列がある場合はDuplicate columnとして正常終了する）。
                # standings.demotion_point_eventは、run_season.py側で「この季に降級点が
                # 増えた(gained)／0に戻った(cleared)」をその季の行にだけ記録する新列
                # （結果タブ・リーグタブの「点」「消」簡易表示用）
                SQL_LIST=(
                  'ALTER TABLE individuals ADD COLUMN demotion_points INT NOT NULL DEFAULT 0;'
                  'ALTER TABLE retired_archive ADD COLUMN demotion_points INT NOT NULL DEFAULT 0;'
                  'ALTER TABLE standings ADD COLUMN demotion_point_event VARCHAR(16) NULL;'
                )
                ;;
              add_retirement_reason_columns)
                # 引退理由（年齢規定／降級点）を個体情報ページの段位履歴に表示するための列。
                # 引退した季は既存のretired_season列をそのまま使うので、ここでは追加しない。
                # 現役のindividualsには引退理由が無いのでretired_archiveのみに追加する
                SQL_LIST=(
                  'ALTER TABLE retired_archive ADD COLUMN retirement_reason VARCHAR(64) NULL;'
                )
                ;;
              add_inquiry_feature)
                # ファンサイトの「問い合わせ」タブ用。新規棋戦（NHK杯・JT杯のような、
                # 段位・タイトル保持・降級点免除に影響しない単発の冠スポンサー杯）の
                # 協賛ニーズ等、自由記述の要望をここに溜め、必要に応じて手動で対応する
                SQL_LIST=(
                  'CREATE TABLE IF NOT EXISTS inquiries (id INT AUTO_INCREMENT PRIMARY KEY, category VARCHAR(32) NOT NULL, message VARCHAR(1000) NOT NULL, contact VARCHAR(100) NULL, ip_hash CHAR(64) NOT NULL, created_at DATETIME NOT NULL DEFAULT CURRENT_TIMESTAMP);'
                )
                ;;
              cleanup_test_sponsor_data_20261008)
                # Stripe本番移行前に、debug_query=sponsorsで洗い出したテスト投稿2件を削除する
                # 一回限りのクリーンアップ（該当行をid・個体ID・内容・日時まで特定した
                # 固定条件のため、以降に入る本物のデータを誤って消す心配はない）
                SQL_LIST=(
                  "DELETE FROM sponsors WHERE id = 1 AND individual_id = 'D0-006' AND display_name = 'てすと';"
                  "DELETE FROM cheer_log WHERE individual_id = 'CC33-000' AND message = 'がんばれ！' AND created_at = '2026-10-07 19:19:02';"
                )
                ;;
              cleanup_stale_retired_individuals_rows_20261009)
                # 根本原因：import_from_github.php/import_from_colab.phpが引退個体を
                # retired_archiveへ移す際、individuals側は「UPDATE ... SET retired = 1」で
                # 済ませており行自体を削除していなかった。api.phpのSELECT * FROM individuals
                # WHERE id = :idはretired列を見ずに先にヒットしてしまうため、retired_archive側
                # の情報（retirement_reason等）が個体ページに一切表示されない不具合になっていた
                # （上田杏・北村深美含め約100件が該当）。該当スクリプトは修正済みのものを
                # 別途サーバーへ配置するが、既存の重複行はこのマイグレーションで一括削除する
                SQL_LIST=(
                  'DELETE FROM individuals WHERE id IN (SELECT id FROM retired_archive);'
                )
                ;;
              add_newcomer_master_columns)
                # 新人リーグ結果タブに師匠表示を追加するための列。
                # 新人リーグの参加者には出場時点で既に師匠が決まっている（parent_a_id）が、
                # これまでnewcomer_league_standingsには保存していなかったため追加する
                SQL_LIST=(
                  'ALTER TABLE newcomer_league_standings ADD COLUMN master_id VARCHAR(32) NULL;'
                  'ALTER TABLE newcomer_league_standings ADD COLUMN master_name VARCHAR(30) NULL;'
                )
                ;;
              add_gender_column)
                # ファンサイトの顔アイコン（DiceBear Lorelei）を個体の性別で出し分けるための列。
                # genderはPython側のシミュレーションでは既に個体ごとに持っている値だが、
                # これまでDBには一切取り込んでいなかったため追加する
                SQL_LIST=(
                  'ALTER TABLE individuals ADD COLUMN gender VARCHAR(10) NULL;'
                  'ALTER TABLE retired_archive ADD COLUMN gender VARCHAR(10) NULL;'
                )
                ;;
              reset_fan_site_data_20261011)
                # 季のリセット（evolve.yml reset=true）に合わせて、ファンサイト側の
                # 季に紐づく蓄積データも一括クリアする一回限りの操作。evolve.yml reset=true
                # 自体は個体・対局等の本戦データ（reset_database.php）とdata/news/articles.json
                # のみを対象にしており、cheer_log・article_likes・sponsors・permanent_sponsors・
                # supporters・inquiriesは触れないため、ここで明示的に空にする
                SQL_LIST=(
                  'DELETE FROM cheer_log;'
                  'DELETE FROM article_likes;'
                  'DELETE FROM sponsors;'
                  'DELETE FROM permanent_sponsors;'
                  'DELETE FROM supporters;'
                  'DELETE FROM inquiries;'
                )
                ;;
              fix_newcomer_standings_stale_master_20261011)
                # リセット漏れ（data/newcomer_candidate_pool.json）により、第2季新人リーグの
                # 2名分（CCNL-000・CCNL-001）にリセット前の旧個体ID（CC26-001・D8-000）が
                # master_idとして紛れ込んでいた。import_from_github.phpは既存行を更新しない
                # （0件登録/更新で対象なしと表示される）ため、GitHub上のdata/newcomer_league/
                # for_season_2.jsonを直しただけではDB側の表示が直らず、ここで直接UPDATEする
                SQL_LIST=(
                  "UPDATE newcomer_league_standings SET master_id = NULL, master_name = NULL WHERE for_season = 2 AND individual_id IN ('CCNL-000', 'CCNL-001');"
                )
                ;;
              fix_newcomer_duplicate_name_20261018)
                # 新人リーグが名前の台帳を引き継いでいなかったため、第24季から出走する新人が
                # 現役の小池陽介（CC17-001）と同名になっていた。新人側を「小池陽介2」に改める
                SQL_LIST=(
                  "UPDATE newcomer_league_standings SET display_name = '小池陽介2' WHERE for_season = 24 AND display_name = '小池陽介';"
                )
                ;;
              fix_season_101_duplicates_20261028)
                # 第101季は、season_state.jsonが100MBを超えてGitHubへのpushに失敗した実行が5回あり、
                # そのたびに別々の結果がサーバーへ取り込まれて、対局が約5倍に重複し、タイトル履歴も
                # 失敗した実行のものが残っていた。第101季の対局・順位・タイトル履歴を消し、GitHub上の正しい
                # データ（この後のプル型インポートで取り込み直す）だけにする。あわせて、失敗した実行でだけ
                # 引退した選手の引退記録と、失敗した実行でだけ生まれた選手を消す（GitHub上の名簿を正とする）
                mapfile -t SQL_LIST < <(python3 - <<'PYEOF'
          import json, re
          state = json.load(open("data/season_state.json", encoding="utf-8"))
          rosters = json.load(open("data/rosters.json", encoding="utf-8"))
          ok = re.compile(r"^[A-Za-z0-9_-]+$")
          retired = sorted(r["id"] for r in state.get("retired_archive", []) if ok.match(r.get("id", "")))
          active = sorted(d["id"] for lg in "ABCD" for d in rosters.get(lg, []) if ok.match(d.get("id", "")))
          for t in ("matches", "title_history", "standings", "suzaku_group_standings"):
              print(f"DELETE FROM {t} WHERE season = 101;")
          q = lambda ids: ",".join(f"'{i}'" for i in ids)
          print(f"DELETE FROM retired_archive WHERE retired_season >= 101 AND id NOT IN ({q(retired)});")
          print(f"DELETE FROM individuals WHERE id NOT IN ({q(active)});")
          PYEOF
                )
                ;;
              rename_numbered_names_20261027)
                # 同名を避けるための連番つきの名前（青山亜紀子2・小池陽介2）を、連番の無い別の名前に改める。
                # data/配下のJSONは同じ対応表で書き換え済み。DB側は名前を持つ列を直接直す
                SQL_LIST=()
                for pair in "CC70-000:青山亜紀子2:青山杏子" "CC24-002:小池陽介2:小池亮"; do
                  IFS=: read -r iid old new <<< "$pair"
                  SQL_LIST+=(
                    "UPDATE individuals SET display_name = '${new}' WHERE id = '${iid}';"
                    "UPDATE retired_archive SET display_name = '${new}' WHERE id = '${iid}';"
                    "UPDATE standings SET display_name = '${new}' WHERE individual_id = '${iid}';"
                    "UPDATE title_history SET holder_name = '${new}' WHERE holder_name = '${old}';"
                    "UPDATE newcomer_league_standings SET display_name = '${new}' WHERE display_name = '${old}';"
                    "UPDATE newcomer_league_standings SET master_name = '${new}' WHERE master_name = '${old}';"
                  )
                done
                ;;
              sync_retired_clan_roots)
                # 一門の独立（apply_clan_independence）は引退済みの子孫のclan_root_idも付け替えるが、
                # サーバー側の取り込み（import_from_github.php等）はretired_archiveを
                # INSERT IGNOREで入れるだけで既存行を更新しないため、DB上は独立前の一門のまま残り、
                # ファンサイトの一門ページで「（引退）が独立して一門を興す」と誤表示されていた
                # （第18季の高木真央の独立で、引退済みの弟子・千葉彩香が該当）。
                # data/season_state.jsonのretired_archiveを正として、clan_root_idと独立情報を同期する。
                # 何度実行しても同じ結果になる（独立が起きた季の本戦から自動で呼ばれる）
                mapfile -t SQL_LIST < <(python3 - <<'PYEOF'
          import json, re
          state = json.load(open("data/season_state.json", encoding="utf-8"))
          ok = re.compile(r"^[A-Za-z0-9_-]+$")
          for r in state.get("retired_archive", []):
              iid, root = r.get("id"), r.get("clan_root_id")
              if not (iid and root and ok.match(iid) and ok.match(root)):
                  continue
              print(f"UPDATE retired_archive SET clan_root_id = '{root}' WHERE id = '{iid}' AND (clan_root_id IS NULL OR clan_root_id <> '{root}');")
          # 現役選手も、一門の組み直し（継承型への移行で過去にさかのぼって再計算した等）に備えて同期する
          rosters = json.load(open("data/rosters.json", encoding="utf-8"))
          for members in rosters.values():
              for r in members:
                  iid, root = r.get("id"), r.get("clan_root_id")
                  if not (iid and root and ok.match(iid) and ok.match(root)):
                      continue
                  print(f"UPDATE individuals SET clan_root_id = '{root}' WHERE id = '{iid}' AND (clan_root_id IS NULL OR clan_root_id <> '{root}');")
          PYEOF
                )
                echo "対象 ${#SQL_LIST[@]} 件"
                ;;
              fix_backfill_demotion_reset_20261012)
                # 繰り上げ（backfill）でDからCへ上がった個体の降級点をリセットしていなかったため、
                # 第6季にD4位から繰り上げでCへ上がった中田由紀（CC3-002）に降級点1が残っていた。
                # 結果タブの記録（cleared2）と現在の降級点（0）を直接直す
                SQL_LIST=(
                  "UPDATE standings SET demotion_point_event = 'cleared2', demotion_points = 0 WHERE season = 6 AND individual_id = 'CC3-002' AND league = 'D';"
                  "UPDATE individuals SET demotion_points = 0 WHERE id = 'CC3-002';"
                )
                ;;
              fix_demotion_won_event_20261012)
                # 勝ち越しによる降級点-1（0点まで減らなかった場合）の結果タブ表示用イベント（won{N}）を
                # 記録していなかったため、第5季の田村麻衣（2→1点）の表示が抜けていた。
                # import_from_github.phpは既存行を更新しないため、ここで直接UPDATEする
                SQL_LIST=(
                  "UPDATE standings SET demotion_point_event = 'won2' WHERE season = 5 AND individual_id = 'C0-000' AND league = 'D';"
                )
                ;;
              fix_newcomer_standings_stale_master_round2_20261011)
                # fix_newcomer_standings_stale_master_20261011は目視で見つけた2件のみを
                # 対象にしていたが、その後data/rosters.json・season_state.jsonの実在個体ID
                # 全件とfor_season_2.jsonの全master_idを機械的に突き合わせたところ、
                # 同じ原因（リセット漏れのdata/newcomer_candidate_pool.json）による汚染が
                # さらに3件（CCNL-002・CCNL-003・CCNL-004）残っていたことが判明した
                SQL_LIST=(
                  "UPDATE newcomer_league_standings SET master_id = NULL, master_name = NULL WHERE for_season = 2 AND individual_id IN ('CCNL-002', 'CCNL-003', 'CCNL-004');"
                )
                ;;
              *)
                echo "::error::未知のマイグレーション: ${RUN_MIGRATION}"
                rm -f /tmp/deploy_key
                exit 1
                ;;
            esac
            # base64はシェルのメタ文字を含まないため、そのままリモートコマンド文字列に
            # 埋め込んでも引用符崩れの心配がない（複数文をNUL区切りで1回のSSH呼び出しに渡す）
            SQL_B64="$(printf '%s\0' "${SQL_LIST[@]}" | base64 -w0)"
            # SSH経由の既定の`php`（CLI用の古いバージョンのことが多い）はdb_config.phpの
            # 構文（戻り値型宣言など）を解釈できずPHP Parse errorになることがあるため、
            # Webサイト提供に使われているであろう新しめのバージョン別バイナリを順に探して使う
            # （xserverでは `php81`/`php82`のようにドット無しで提供されるのが一般的）
            retry_cmd ssh -i /tmp/deploy_key -p "$XSERVER_PORT" -o StrictHostKeyChecking=no -o ConnectTimeout=15 \
              "$XSERVER_USER@$XSERVER_HOST" \
              "PHP_BIN=\$(command -v php84 || command -v php83 || command -v php82 || command -v php81 || command -v php80 || command -v php74 || command -v php8.4 || command -v php8.3 || command -v php8.2 || command -v php8.1 || command -v php8.0 || command -v php7.4 || command -v php); \"\$PHP_BIN\" -r '
                require \"${XSERVER_SITE_DIR}db_config.php\";
                \$pdo = league_db_connect();
                \$list = array_filter(array_map(\"trim\", explode(\"\\0\", base64_decode(\"${SQL_B64}\"))));
                foreach (\$list as \$sql) {
                  try {
                    \$pdo->exec(\$sql);
                    echo \"OK: \" . substr(\$sql, 0, 60) . PHP_EOL;
                  } catch (\PDOException \$e) {
                    \$msg = \$e->getMessage();
                    if (strpos(\$msg, \"Duplicate column\") !== false || strpos(\$msg, \"already exists\") !== false) {
                      echo \"OK(既に適用済み): \" . substr(\$sql, 0, 60) . PHP_EOL;
                    } else {
                      throw \$e;
                    }
                  }
                }
              '"
            rm -f /tmp/deploy_key
            exit 0
          fi

          if [ -n "$CREATE_DIR" ]; then
            d="$(echo "$CREATE_DIR" | xargs)"
            # 英数字・ハイフン・アンダースコア・スラッシュのみ許可（コマンド注入・パストラバーサル対策）
            if [[ -z "$d" || ! "$d" =~ ^[A-Za-z0-9_/-]+$ || "$d" == *".."* || "$d" == /* ]]; then
              echo "::error::不正なディレクトリパス: '$d'"
              rm -f /tmp/deploy_key
              exit 1
            fi
            echo "=== ${XSERVER_LAB_DIR}${d} を作成 ==="
            retry_cmd ssh -i /tmp/deploy_key -p "$XSERVER_PORT" -o StrictHostKeyChecking=no -o ConnectTimeout=15 \
              "$XSERVER_USER@$XSERVER_HOST" "mkdir -pv -- '${XSERVER_LAB_DIR}${d}'"
            rm -f /tmp/deploy_key
            exit 0
          fi

          if [ -n "$DEBUG_QUERY" ]; then
            echo "=== 確認クエリ実行: ${DEBUG_QUERY} ==="
            case "$DEBUG_QUERY" in
              demotion_points)
                PHP_QUERY='
                  $stmt = $pdo->query("SELECT id, display_name, league, demotion_points FROM individuals WHERE demotion_points > 0 ORDER BY league, id");
                  $rows = $stmt->fetchAll();
                  if (!$rows) { echo "demotion_points > 0 の個体はいません" . PHP_EOL; }
                  foreach ($rows as $r) {
                    echo $r["league"] . " " . $r["id"] . " " . $r["display_name"] . " demotion_points=" . $r["demotion_points"] . PHP_EOL;
                  }
                '
                ;;
              sponsors)
                # サポーター機能のテスト投稿を洗い出すための確認用（sponsors・
