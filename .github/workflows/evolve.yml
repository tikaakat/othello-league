name: Run Othello League Season

concurrency:
  group: othello-league
  cancel-in-progress: false

on:
  workflow_dispatch:
    inputs:
      seasons:
        description: "何シーズン分進めるか"
        required: false
        default: "1"
      swiss_rounds:
        description: "B/C/Dリーグのスイスラウンド数"
        required: false
        default: "4"
      reset:
        description: "trueにすると、既存データ（ロスター・対局ログ・順位表・タイトル保持者など）を全て削除し、シーズン1から最初にやり直します"
        required: false
        default: "false"
  schedule:
    # 1日2季（朝・夜）回す。それぞれ1季ずつ進める（inputs省略時はseasons=1がデフォルトのため）。
    # 新人リーグ（newcomer_league.yml）は本戦の1時間後に実行される（本戦→新人リーグの順）。
    # これは、Dリーグの欠員数（新人リーグの募集人数の元になる値）が対局結果が出るまで
    # 確定しないため。本戦がその季の対局を終えて欠員を確定させた直後に新人リーグを回すことで、
    # 「直前に確定したばかりの正確な欠員数」を使って募集人数を決められる。
    #
    # 朝 6:00 JST(=21:00 UTC 前日)：この回の対局開始前に、前回（夜18:00）の新人リーグの
    #   勝者をrecruit_d_league()で取り込み、その季からそのまま出走させる
    #   （newcomer_winners.jsonは読み取り後に削除されるため、二重適用はされない）。
    #   対局後に確定したこの回の欠員数は、1時間後（7:00）の新人リーグへ引き継がれる。
    # 夜 18:00 JST(=09:00 UTC)：同様に、前回（朝7:00）の新人リーグの勝者を取り込んで
    #   出走させ、対局後に確定した欠員数を1時間後（19:00）の新人リーグへ引き継ぐ。
    #
    # 本戦→新人リーグの順で同じ排他グループ（concurrency: othello-league）を使うため、
    # 前段が長引いても後段は失敗せずキューで待機する
    - cron: "0 21 * * *"
    - cron: "0 9 * * *"

jobs:
  run-season:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run season(s) one at a time (with per-season push)
        timeout-minutes: 340
        env:
          XSERVER_HOST: ${{ secrets.XSERVER_HOST }}
          XSERVER_USER: ${{ secrets.XSERVER_USER }}
          XSERVER_PORT: ${{ secrets.XSERVER_SSH_PORT }}
          XSERVER_TARGET_DIR: ${{ secrets.XSERVER_TARGET_DIR }}
          XSERVER_SSH_KEY: ${{ secrets.XSERVER_SSH_KEY }}
          IMPORT_URL: "https://lab.spia-net.com/othello-league/import_from_colab.php?key=${{ secrets.IMPORT_SECRET_KEY }}"
          PULL_IMPORT_URL: "https://lab.spia-net.com/othello-league/import_from_github.php?key=${{ secrets.IMPORT_SECRET_KEY }}"
          RESET_DB_URL: "https://lab.spia-net.com/othello-league/reset_database.php?key=${{ secrets.IMPORT_SECRET_KEY }}"
          MIGRATIONS_URL: "https://lab.spia-net.com/othello-league/run_migrations.php?key=${{ secrets.IMPORT_SECRET_KEY }}"
        run: |
          git config user.name "othello-league-bot"
          git config user.email "actions@users.noreply.github.com"

          echo "$XSERVER_SSH_KEY" > /tmp/deploy_key
          chmod 600 /tmp/deploy_key

          # xserverへの接続が一時的なタイムアウトで失敗することがあるため、
          # ネットワーク系コマンドは短いリトライを1回だけ挟んでから諦める
          # （xserver自体が長時間ダウンしている場合にリトライを重ねると、
          #  1バッチあたり何分も無駄になりシーズン進行が大幅に遅くなるため、
          #  ここでの粘りは最小限にとどめる）
          retry_cmd() {
            local max_attempts=2
            local delay=5
            local attempt=1
            until "$@"; do
              if [ "$attempt" -ge "$max_attempts" ]; then
                return 1
              fi
              echo "::warning::コマンド失敗（試行 $attempt/$max_attempts）。${delay}秒後にリトライします: $*"
              sleep "$delay"
              attempt=$((attempt + 1))
            done
          }

          # xserverが今回のバッチ実行中に一度でも完全に応答不能と判明したら、
          # 以降のバッチではリトライ・フォールバックを省略して即座に諦め、
          # 無駄な待ち時間でシーズン進行を遅らせないようにする
          # （最後にもう一度だけ、最終同期チェックでまとめて再挑戦する）
          XSERVER_LIKELY_DOWN=0

          echo "=== 未適用のDBマイグレーションを自動適用 ==="
          retry_cmd curl -sS -f --connect-timeout 8 --max-time 20 "$MIGRATIONS_URL" \
            || echo "::warning::マイグレーションの適用に失敗しました。手動で確認してください"

          RESET="${{ github.event.inputs.reset || 'false' }}"
          if [ "$RESET" = "true" ]; then
            echo "=== 一括リセット: 既存データを削除してシーズン1からやり直します ==="

            rm -rf data/rosters.json data/season_state.json data/matches data/standings \
              data/newcomer_league data/newcomer_winners.json data/newcomer_submissions.json
            mkdir -p data/matches data/standings data/newcomer_league
            touch data/matches/.gitkeep data/standings/.gitkeep data/newcomer_league/.gitkeep

            git add -A data
            if ! git diff --staged --quiet; then
              git commit -m "Reset season data [skip ci]"
              retry_cmd git pull --rebase origin main \
                || echo "::warning::git pull --rebaseに失敗しました（リセット時）。そのままpushを試みます"
              retry_cmd git push \
                || echo "::warning::git pushに失敗しました（リセット時）。次のバッチでまとめて再pushを試みます"
            fi

            echo "--- Xserver側のデータも削除中 ---"
            # newcomer_leagueもここで削除しないと、xserver側に残った古いfor_season_*.jsonが
            # 次回のプッシュ型インポート（import_from_colab.php、ディレクトリ内を全件スキャンする
            # 仕様のためスキップ判定が無い）で毎回再取り込みされ、MySQL側をリセットしても
            # 古い新人リーグ結果が復活してしまう
            retry_cmd ssh -i /tmp/deploy_key -p "$XSERVER_PORT" -o StrictHostKeyChecking=no -o ConnectTimeout=15 \
              "$XSERVER_USER@$XSERVER_HOST" \
              "rm -rf ${XSERVER_TARGET_DIR}matches ${XSERVER_TARGET_DIR}standings ${XSERVER_TARGET_DIR}rosters.json ${XSERVER_TARGET_DIR}season_state.json ${XSERVER_TARGET_DIR}newcomer_league && mkdir -p ${XSERVER_TARGET_DIR}matches ${XSERVER_TARGET_DIR}standings ${XSERVER_TARGET_DIR}newcomer_league" \
              || echo "::warning::Xserver側のリセットに失敗しました。手動で確認してください"

            echo "--- MySQL側の全テーブルもクリア中 ---"
            retry_cmd curl -sS -f --connect-timeout 8 --max-time 20 "$RESET_DB_URL" \
              || echo "::warning::MySQL側のリセットに失敗しました。手動で確認してください"
          fi

          TOTAL="${{ github.event.inputs.seasons || '1' }}"
          SWISS_ROUNDS="${{ github.event.inputs.swiss_rounds || '4' }}"

          # キャラクリエイトの投稿は、朝の新人リーグ（newcomer_league.yml）が先に処理し、
          # 勝者をdata/newcomer_winners.jsonとしてこのリポジトリにpush済みのはず。
          # run_season.py側がそれを自動的に読み込む（無ければ何もせず通常進行する）ので、
          # ここでは特に何も取得しない

          for i in $(seq 1 "$TOTAL"); do
            echo "=== Running season batch $i / $TOTAL ==="

            set +e
            python -u run_season.py \
              --data-dir data \
              --seasons 1 \
              --swiss-rounds "$SWISS_ROUNDS"
            PY_EXIT=$?
            set -e

            echo "=== Python終了コード: $PY_EXIT ==="
            echo "=== data/ の中身 ==="
            ls -la data/ 2>&1 || echo "(data/ ディレクトリが存在しません)"

            if [ "$PY_EXIT" -ne 0 ]; then
              echo "::error::run_season.pyが失敗しました（終了コード $PY_EXIT）。このバッチをスキップして次へ進みます"
              continue
            fi

            git add data/rosters.json data/season_state.json data/matches data/standings
            # run_season.py側はnewcomer_winners.json（新人リーグの勝者ファイル）を
            # 読み込み後にローカルで削除するが、ここでcommit対象に含めておかないと
            # 削除がpushされず、次回のバッチ（fresh checkout）でまだ残っている古い
            # ファイルを再度読み込んで同じ新人を二重に昇格させてしまう。
            # ファイルが元々存在しない場合はgit addが失敗するので無視する
            git add data/newcomer_winners.json 2>/dev/null || true
            if ! git diff --staged --quiet; then
              git commit -m "Season batch $i/$TOTAL [skip ci]"

              # pushが失敗する主因は、新人リーグ（newcomer_league.yml）側がこの実行の直後に
              # data/newcomer_winners.jsonを新しく書き込んでpushしているケース。単純な
              # 「git pull --rebase」だと「削除（この季で消費済み） vs 変更（次回分の新しい結果）」の
              # 競合が自動解決できずrebaseごと失敗することがあったため、失敗するたびに
              # 「git reset --mixed」で最新originの上へ今回のコミット内容を積み直す方式にする
              # （rebaseの競合解決に頼らないので、この種の競合が原理的に起こらない）
              PUSHED=0
              for attempt in 1 2 3 4; do
                if git push; then
                  PUSHED=1
                  break
                fi
                echo "::warning::git push 失敗（試行 ${attempt}/4、バッチ $i）。最新のmainを取り込んで積み直します"
                retry_cmd git fetch origin main || break
                git reset --mixed origin/main
                git add data/rosters.json data/season_state.json data/matches data/standings
                git add data/newcomer_winners.json 2>/dev/null || true
                if git diff --staged --quiet; then
                  echo "最新のmainに既に同じ内容が反映されていました（他の実行と重複した可能性）"
                  PUSHED=1
                  break
                fi
                git commit -m "Season batch $i/$TOTAL [skip ci]"
                sleep $((attempt * 3))
              done

              if [ "$PUSHED" != "1" ]; then
                echo "::warning::git pushに複数回失敗しました（バッチ $i）。コミットはローカルに残り、次のバッチでまとめて再pushを試みます"
              fi
            fi

            if [ "$XSERVER_LIKELY_DOWN" -eq 1 ]; then
              echo "--- Xserverが今回既に応答不能と判明しているため、バッチ $i の反映は1回だけ軽く試みてスキップします ---"
              ssh -i /tmp/deploy_key -p "$XSERVER_PORT" -o StrictHostKeyChecking=no -o ConnectTimeout=8 \
                "$XSERVER_USER@$XSERVER_HOST" "mkdir -p ${XSERVER_TARGET_DIR}matches ${XSERVER_TARGET_DIR}standings" >/dev/null 2>&1 \
                && XSERVER_LIKELY_DOWN=0 || echo "::warning::引き続き応答なし（バッチ $i、以降も最終同期まで反映をスキップします）"
            fi

            if [ "$XSERVER_LIKELY_DOWN" -eq 0 ]; then
              echo "--- Xserverへ反映中（バッチ $i）---"
              PUSH_OK=1

              retry_cmd ssh -i /tmp/deploy_key -p "$XSERVER_PORT" -o StrictHostKeyChecking=no -o ConnectTimeout=8 \
                "$XSERVER_USER@$XSERVER_HOST" "mkdir -p ${XSERVER_TARGET_DIR}matches ${XSERVER_TARGET_DIR}standings ${XSERVER_TARGET_DIR}newcomer_league" \
                || { echo "::warning::フォルダ作成に失敗しました（バッチ $i）"; PUSH_OK=0; }

              retry_cmd scp -i /tmp/deploy_key -P "$XSERVER_PORT" -o StrictHostKeyChecking=no -o ConnectTimeout=8 \
                data/rosters.json data/season_state.json \
                "$XSERVER_USER@$XSERVER_HOST:$XSERVER_TARGET_DIR" \
                || { echo "::warning::scpでの転送に失敗しました（バッチ $i）"; PUSH_OK=0; }

              retry_cmd scp -i /tmp/deploy_key -P "$XSERVER_PORT" -o StrictHostKeyChecking=no -o ConnectTimeout=8 -r \
                data/matches/. \
                "$XSERVER_USER@$XSERVER_HOST:${XSERVER_TARGET_DIR}matches/" \
                || { echo "::warning::matches転送に失敗しました（バッチ $i）"; PUSH_OK=0; }

              retry_cmd scp -i /tmp/deploy_key -P "$XSERVER_PORT" -o StrictHostKeyChecking=no -o ConnectTimeout=8 -r \
                data/standings/. \
                "$XSERVER_USER@$XSERVER_HOST:${XSERVER_TARGET_DIR}standings/" \
                || { echo "::warning::standings転送に失敗しました（バッチ $i）"; PUSH_OK=0; }

              # 新人リーグの結果（朝のnewcomer_league.yml実行分）。まだ一度も
              # 新人リーグが実行されていない場合はdata/newcomer_league/が空の可能性があるため、
              # 中身が無くても失敗扱いにしない
              if [ -n "$(ls -A data/newcomer_league/ 2>/dev/null)" ]; then
                retry_cmd scp -i /tmp/deploy_key -P "$XSERVER_PORT" -o StrictHostKeyChecking=no -o ConnectTimeout=8 -r \
                  data/newcomer_league/. \
                  "$XSERVER_USER@$XSERVER_HOST:${XSERVER_TARGET_DIR}newcomer_league/" \
                  || { echo "::warning::newcomer_league転送に失敗しました（バッチ $i）"; PUSH_OK=0; }
              fi

              if [ "$PUSH_OK" -eq 1 ]; then
                echo "--- プッシュ型インポートを実行中（バッチ $i）---"
                retry_cmd curl -sS -f --connect-timeout 8 --max-time 20 "$IMPORT_URL" \
                  || { echo "::warning::プッシュ型インポートに失敗しました（バッチ $i）。プル型にフォールバックします"; PUSH_OK=0; }
              fi

              if [ "$PUSH_OK" -eq 0 ]; then
                echo "--- scpまたはプッシュ型インポートが失敗したため、プル型（GitHubから直接取得）にフォールバックします（バッチ $i）---"
                retry_cmd curl -sS -f --connect-timeout 8 --max-time 20 "$PULL_IMPORT_URL" \
                  || { echo "::warning::プル型インポートも失敗しました（バッチ $i）。以降のバッチはXserverへの反映を省略し、最終同期でまとめて再挑戦します"; XSERVER_LIKELY_DOWN=1; }
              fi
            fi
          done

          # 全バッチ終了後、途中の同期失敗でサイト側が古いままになっていないか最終確認として、
          # 最新のrosters.json/season_state.jsonでもう一度だけ反映を試みる（自己修復）
          echo "=== 最終同期チェック ==="
          FINAL_OK=1
          retry_cmd ssh -i /tmp/deploy_key -p "$XSERVER_PORT" -o StrictHostKeyChecking=no -o ConnectTimeout=8 \
            "$XSERVER_USER@$XSERVER_HOST" "mkdir -p ${XSERVER_TARGET_DIR}matches ${XSERVER_TARGET_DIR}standings ${XSERVER_TARGET_DIR}newcomer_league" \
            || FINAL_OK=0
          retry_cmd scp -i /tmp/deploy_key -P "$XSERVER_PORT" -o StrictHostKeyChecking=no -o ConnectTimeout=8 \
            data/rosters.json data/season_state.json \
            "$XSERVER_USER@$XSERVER_HOST:$XSERVER_TARGET_DIR" \
            || FINAL_OK=0
          retry_cmd scp -i /tmp/deploy_key -P "$XSERVER_PORT" -o StrictHostKeyChecking=no -o ConnectTimeout=8 -r \
            data/matches/. "$XSERVER_USER@$XSERVER_HOST:${XSERVER_TARGET_DIR}matches/" \
            || FINAL_OK=0
          retry_cmd scp -i /tmp/deploy_key -P "$XSERVER_PORT" -o StrictHostKeyChecking=no -o ConnectTimeout=8 -r \
            data/standings/. "$XSERVER_USER@$XSERVER_HOST:${XSERVER_TARGET_DIR}standings/" \
            || FINAL_OK=0
          if [ -n "$(ls -A data/newcomer_league/ 2>/dev/null)" ]; then
            retry_cmd scp -i /tmp/deploy_key -P "$XSERVER_PORT" -o StrictHostKeyChecking=no -o ConnectTimeout=8 -r \
              data/newcomer_league/. "$XSERVER_USER@$XSERVER_HOST:${XSERVER_TARGET_DIR}newcomer_league/" \
              || FINAL_OK=0
          fi
          if [ "$FINAL_OK" -eq 1 ]; then
            retry_cmd curl -sS -f --connect-timeout 8 --max-time 20 "$IMPORT_URL" || FINAL_OK=0
          fi
          if [ "$FINAL_OK" -eq 0 ]; then
            retry_cmd curl -sS -f --connect-timeout 8 --max-time 20 "$PULL_IMPORT_URL" \
              && FINAL_OK=1 \
              || echo "::warning::最終同期にも失敗しました。xserver側の状態を手動で確認してください（GitHub上のデータ自体は正常に保存されています）"
          fi

          rm -f /tmp/deploy_key

          # 最終同期（プッシュ型・プル型とも）が最後まで失敗した場合のみ、ジョブそのものを
          # 失敗扱いにする（GitHub Actionsの失敗通知メールで気付けるようにするため。
          # シーズン計算・GitHubへのpushは既に成功しており、データはGitHub上に残っているので、
          # 失敗させてもデータロスにはならない。後でプル型を手動実行すれば復旧できる）
          if [ "$FINAL_OK" -eq 0 ]; then
            echo "::error::サイトへの最終同期（プッシュ型・プル型とも）に失敗しました。GitHub上のデータは正常に保存されていますが、サイトへの反映には手動対応（プル型インポートの実行）が必要です。"
            exit 1
          fi
