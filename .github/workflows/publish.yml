name: Publish Season (計算済みの季をサイトに公開)
run-name: "Publish Season${{ inputs.season && format(' {0}', inputs.season) || '' }}${{ inputs.slot && format(' [slot {0}]', inputs.slot) || '' }}${{ inputs.preview == 'true' && ' [preview]' || '' }}${{ inputs.reset == 'true' && ' [reset]' || '' }}${{ inputs.unpublish == 'true' && ' [unpublish]' || '' }}"

# 順次公開モード（publish/state.json の mode が replay）：
# 季は先に計算しておき（ストック）、公開時刻（JST 7:30・21:00）ごとに1季ずつサイトへ出す。
# 第s季を出すときは、GitHubの履歴から「第s季が終わった時点（その後の新人リーグ・記事まで）」のdata/を取り出し、
# そこから結果のページを全部作り（cloudflare/build/build.sh）、Cloudflare（othello.spia-net.com の Worker）に上げる。
# データサイトは / 、ファンサイトは /news/ 。予想・掲示板などの利用者のデータは Cloudflare D1 にある。
# 第s季が終わった時点＝第s+1季の順位表（data/standings/season_{s+1}.json）を追加したコミットの、1つ前のコミット。
# まだ次の季を計算していなければ、最新のコミット（mainの先頭）。
#
# 公開のあと、publish/state.json の published_season を進め、残りのストックが少なければ本戦を連続実行で
# 起動して補充し（計算はサイトに出さない）、次の回のタイマー（next_slot.yml）を仕掛ける。
#
# 手動実行：reset=true で、サイトのデータを消してから公開する（第1季からやり直すとき。season=1 と一緒に使う）。
# season を指定すると、その季を出す（省略時は published_season+1）。
#
# 公開の取り消し：unpublish=true で、両サイトを「近日公開」のページ（publish/coming_soon.html）に差し替え、
# 利用者のデータ（予想・掲示板・応援・いいね）を消し、publish/state.json を published_season=0・paused=true にする（タイマーも止まる）。
# 始動するときは season=1 reset=true で実行する（本来のページに戻して第1季を出し、paused を外して定時公開を再開する）。

on:
  workflow_dispatch:
    inputs:
      slot:
        description: "next_slot.ymlが付ける回（例: 2026-11-24-AM）。指定するとその回の公開時刻まで待ってから公開する。手動なら空でよい"
        required: false
        default: ""
      season:
        description: "公開する季（省略時は published_season+1）"
        required: false
        default: ""
      reset:
        description: "trueにすると、公開の前にサイト側のデータ（DB・取り込み用ファイル）を消す（第1季からやり直すとき）"
        required: false
        default: "false"
      preview:
        description: "trueにすると、公開はせず確認用のURL（preview-othello-league.….workers.dev）にだけ上げる（season で季を指定。記録・タイマーは触らない）"
        required: false
        default: "false"
      unpublish:
        description: "trueにすると、公開を取り消して両サイトを「近日公開」にし、定時公開を止める（始動は season=1 reset=true）"
        required: false
        default: "false"

concurrency:
  group: othello-publish
  cancel-in-progress: false

permissions:
  contents: write  # publish/state.json を更新するため
  actions: write   # 本戦（ストック補充）・次の回のタイマーを起動するため

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    # 結果のページを作るときに、いまの api.php をそのまま動かすための一時的なDB（Xserverと同じ MariaDB）
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_USER: league
          MARIADB_PASSWORD: league
          MARIADB_DATABASE: othello
        ports: ["3306:3306"]
        options: --health-cmd="healthcheck.sh --connect --innodb_initialized" --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      DB_HOST: 127.0.0.1
      DB_USER: root
      DB_PASS: root
      DB_NAME: othello
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Worker の道具（wrangler）を入れる
        working-directory: cloudflare
        run: npm ci --no-audit --no-fund

      - name: 公開を取り消す（近日公開のページに差し替え）
        if: inputs.unpublish == 'true'
        working-directory: cloudflare
        run: |
          set -euo pipefail
          # 両サイト（/ と /news/）を「近日公開」のページだけにする
          rm -rf dist && mkdir -p dist/news
          cp ../publish/coming_soon.html dist/index.html
          cp ../publish/coming_soon.html dist/news/index.html
          cp ../site/ogp.png dist/
          npx wrangler deploy
          # 利用者のデータ（予想・掲示板・応援・いいね）を消す。表は Worker が次のアクセスで作り直す（問い合わせは残す）
          npx wrangler d1 execute othello-league --remote --yes \
            --command "DROP TABLE IF EXISTS predictions; DROP TABLE IF EXISTS board_posts; DROP TABLE IF EXISTS board_threads; DROP TABLE IF EXISTS cheer_log; DROP TABLE IF EXISTS article_likes;"
          cd ..
          git config user.name "othello-league-bot"
          git config user.email "actions@users.noreply.github.com"
          for attempt in 1 2 3 4; do
            git fetch -q origin main && git reset -q --hard origin/main
            python3 -c "import json; p='publish/state.json'; d=json.load(open(p)); d['published_season']=0; d['paused']=True; json.dump(d, open(p,'w'), ensure_ascii=False, indent=2); open(p,'a').write('\n')"
            git add publish/state.json
            git diff --staged --quiet && break
            git commit -q -m "Unpublish: pause until launch [skip ci]"
            git push -q && break
            sleep $((attempt * 3))
          done
          echo "公開を取り消しました。始動は publish.yml を season=1 reset=true で実行してください"

      - name: 公開時刻まで待つ
        if: inputs.slot != '' && inputs.unpublish != 'true'
        run: |
          SLOT_IN="${{ inputs.slot }}"
          SLOT_DATE="${SLOT_IN%-*}"; SLOT_PART="${SLOT_IN##*-}"
          if [ "$SLOT_PART" = "AM" ]; then RELEASE_HM="07:30"; else RELEASE_HM="21:00"; fi
          RELEASE_AT=$(TZ=Asia/Tokyo date -d "${SLOT_DATE} ${RELEASE_HM}" +%s)
          W=$((RELEASE_AT - $(date +%s)))
          if [ "$W" -gt 0 ]; then echo "公開時刻（${SLOT_DATE} ${RELEASE_HM} JST）まで $((W / 60))分 待ちます"; sleep "$W"; fi

      - name: 公開する季の時点のデータを取り出す
        id: snap
        if: inputs.unpublish != 'true'
        run: |
          set -euo pipefail
          git pull -q origin main
          PUB=$(python3 -c "import json; print(json.load(open('publish/state.json')).get('published_season', 0))")
          S="${{ inputs.season }}"; [ -z "$S" ] && S=$((PUB + 1))
          # 第s季の順位表が、いまの世界線（mainの先頭）にあるか
          if [ ! -f "data/standings/season_${S}.json" ]; then
            echo "::error::第${S}季はまだ計算されていません（ストック切れ）。本戦の連続実行で補充してください"
            echo "season=${S}" >> "$GITHUB_OUTPUT"; echo "ok=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # いまの世界線の始まり（最後の「Reset season data」）より後のコミットだけを見る
          # （前の世界線にも同じ番号の季があるため。例：第100季のとき、前の世界線の第101季を拾ってしまう）
          RESET_C=$(git log --format=%H -1 --grep='^Reset season data' || true)
          RANGE="HEAD"; [ -n "$RESET_C" ] && RANGE="${RESET_C}..HEAD"
          NEXT_ADD=$(git log "$RANGE" --diff-filter=A --format=%H -1 -- "data/standings/season_$((S + 1)).json" || true)
          if [ -n "$NEXT_ADD" ]; then SNAP=$(git rev-parse "${NEXT_ADD}^"); else SNAP=$(git rev-parse HEAD); fi
          # 念のため：取り出す時点に第s季があり、第s+1季が無いこと
          git cat-file -e "${SNAP}:data/standings/season_${S}.json"
          if git cat-file -e "${SNAP}:data/standings/season_$((S + 1)).json" 2>/dev/null; then echo "::error::取り出す時点の判定を誤りました"; exit 1; fi
          rm -rf /tmp/snap && mkdir -p /tmp/snap
          git archive "$SNAP" data | tar -x -C /tmp/snap
          echo "第${S}季の時点：$(git log -1 --format='%h %ad %s' --date=iso "$SNAP")"
          ls /tmp/snap/data/standings | sort -V | tail -2
          echo "season=${S}" >> "$GITHUB_OUTPUT"; echo "ok=1" >> "$GITHUB_OUTPUT"

      - name: 公開用のファイルを作る（その季の時点の結果ページ）
        if: steps.snap.outputs.ok == '1'
        run: bash cloudflare/build/build.sh /tmp/snap/data cloudflare/dist

      - name: Cloudflare に上げる
        if: steps.snap.outputs.ok == '1'
        working-directory: cloudflare
        run: |
          set -euo pipefail
          if [ "${{ inputs.reset }}" = "true" ] && [ "${{ inputs.preview }}" != "true" ]; then
            echo "=== 第1季からやり直すので、利用者のデータ（予想・掲示板・応援・いいね）を消す ==="
            npx wrangler d1 execute othello-league --remote --yes \
              --command "DROP TABLE IF EXISTS predictions; DROP TABLE IF EXISTS board_posts; DROP TABLE IF EXISTS board_threads; DROP TABLE IF EXISTS cheer_log; DROP TABLE IF EXISTS article_likes;"
          fi
          if [ "${{ inputs.preview }}" = "true" ]; then
            # 本番は変えずに、確認用のURLにだけ上げる
            npx wrangler versions upload --preview-alias preview
            exit 0
          fi
          npx wrangler deploy

      - name: 公開済みの季を記録
        if: success() && steps.snap.outputs.ok == '1' && inputs.preview != 'true'
        env:
          S: ${{ steps.snap.outputs.season }}
        run: |
          set -uo pipefail
          git config user.name "othello-league-bot"
          git config user.email "actions@users.noreply.github.com"
          for attempt in 1 2 3 4; do
            git fetch -q origin main && git reset -q --hard origin/main
            python3 -c "import json,sys; p='publish/state.json'; d=json.load(open(p)); d['published_season']=int(sys.argv[1]); d.pop('paused', None); json.dump(d, open(p,'w'), ensure_ascii=False, indent=2); open(p,'a').write('\n')" "$S"
            git add publish/state.json
            git diff --staged --quiet && break
            git commit -q -m "Publish season ${S} [skip ci]"
            git push -q && break
            sleep $((attempt * 3))
          done
          echo "第${S}季を公開しました"

      # 公開に失敗しても、ストック補充の判定と次の回のタイマーは必ず行う（次の回で同じ季をもう一度出す）
      - name: ストック補充・次の回のタイマー
        if: always() && inputs.unpublish != 'true' && inputs.preview != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -uo pipefail
          api() { curl -sS -f -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" "$@"; }
          git fetch -q origin main && git reset -q --hard origin/main
          # 公開を取り消して止めている間（paused）は、補充もタイマーも行わない
          if [ "$(python3 -c "import json; print(json.load(open('publish/state.json')).get('paused', False))")" = "True" ]; then
            echo "公開を止めています（paused）。補充・次の回のタイマーは行いません"; exit 0
          fi
          # ストック：計算済みの最新の季 − 公開済みの季。10季（5日分）を切ったら、20季分を連続実行で補充する（計算中はサイトに出ない）
          LATEST=$(ls data/standings | sed -n 's/^season_\([0-9]*\)\.json$/\1/p' | sort -n | tail -1)
          PUB=$(python3 -c "import json; print(json.load(open('publish/state.json')).get('published_season', 0))")
          STOCK=$((LATEST - PUB))
          echo "計算済み：第${LATEST}季　公開済み：第${PUB}季　ストック：${STOCK}季"
          if [ "$STOCK" -lt 10 ]; then
            BUSY=0
            for WF in evolve.yml newcomer_league.yml; do
              N=$(api "https://api.github.com/repos/${REPO}/actions/workflows/${WF}/runs?per_page=5" | python3 -c 'import json,sys; print(sum(1 for r in json.load(sys.stdin)["workflow_runs"] if r["status"] != "completed"))')
              [ "$N" != "0" ] && BUSY=1
            done
            if [ "$BUSY" = 0 ]; then
              echo "ストックが少ないため、本戦を20季分の連続実行で起動します"
              api -X POST "https://api.github.com/repos/${REPO}/actions/workflows/evolve.yml/dispatches" -d '{"ref":"main","inputs":{"chain_remaining":"19"}}' \
                || echo "::warning::ストック補充の起動に失敗しました"
            else
              echo "本戦・新人リーグが実行中のため、補充は次の公開で判定します"
            fi
          fi
          echo "次の回のタイマーを仕掛けます"
          api -X POST "https://api.github.com/repos/${REPO}/actions/workflows/next_slot.yml/dispatches" -d '{"ref":"main"}' \
            || echo "::warning::次の回のタイマーの起動に失敗しました"
