name: Run Newcomer League (新人リーグ)

concurrency:
  group: othello-league
  cancel-in-progress: false

on:
  workflow_dispatch: {}
  schedule:
    # 本戦（evolve.yml）が1日2回（6:05・18:05 JST、朝・夕方）になったのに合わせて、
    # 新人リーグはそれぞれの1時間後に1回ずつ実行する（本戦→新人リーグの順）。
    # 本戦がその季の対局を終えてDリーグの欠員数を確定させた直後に実行することで、
    # 「直前に確定したばかりの正確な欠員数」を募集人数として使える。
    # 勝者データ（data/newcomer_winners.json）は都度リポジトリにpushし、次回（1時間後
    # ではなく次の）本戦実行時にrecruit_d_league()で取り込まれ、その季からそのまま出走する。
    # サイト側（新人リーグの結果タブ）へも、この実行の中でプル型インポートを
    # 呼んですぐ反映させる。
    #   7:05 JST(=22:05 UTC 前日) → 6:05の本戦の欠員を募集
    #   19:05 JST(=10:05 UTC)     → 18:05の本戦の欠員を募集
    # 分を0ちょうどではなく5にずらしているのは、GitHub Actionsのスケジュール実行が
    # 「毎時0分」に集中して大きく遅延しやすいと公式に案内されているため。
    # なお、checkoutのref: main明示（#52）により、キュー待ちで実行開始が遅れても
    # 対象季がずれることはない
    - cron: "5 22 * * *"
    - cron: "5 10 * * *"

jobs:
  run-newcomer-league:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # refを明示しないと、actions/checkoutは「スケジュールイベントが発生した時点」の
          # コミットを取得してしまい、排他グループ（concurrency）での順番待ちが長引いた場合、
          # 実際にジョブが動き出す頃にはmainが先へ進んでいても、チェックアウトされる内容は
          # 古いままになる。本戦（evolve.yml）の実行に数十分〜1時間以上かかることが珍しくなく、
          # 新人リーグ側がその待ち行列で長時間キューイングされることが頻発していたため、
          # current_season等の状態を古いまま読み込み、対象季が実際より1つ古くなる不具合の
          # 根本原因になっていた。refを明示し、ジョブ実行時点の最新mainを必ず取得する
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run newcomer league
        timeout-minutes: 60
        env:
          PENDING_CHAR_URL: "https://lab.spia-net.com/othello-league/export_pending_characters.php?key=${{ secrets.IMPORT_SECRET_KEY }}"
          PULL_IMPORT_URL: "https://lab.spia-net.com/othello-league/import_from_github.php?key=${{ secrets.IMPORT_SECRET_KEY }}"
        run: |
          git config user.name "othello-league-bot"
          git config user.email "actions@users.noreply.github.com"

          retry_cmd() {
            local max_attempts=2
            local delay=5
            local attempt=1
            until "$@"; do
              if [ "$attempt" -ge "$max_attempts" ]; then
                return 1
              fi
              echo "::warning::コマンド失敗（試行 $attempt/$max_attempts）。${delay}秒後にリトライします: $*"
              sleep "$delay"
              attempt=$((attempt + 1))
            done
          }

          echo "=== キャラクリエイト：当日分の作成リクエストを取得 ==="
          retry_cmd curl -sS -f --connect-timeout 8 --max-time 20 -o /tmp/pending_char_response.json "$PENDING_CHAR_URL" \
            && jq '.characters // []' /tmp/pending_char_response.json > data/newcomer_submissions.json \
            || { echo "::warning::キャラクリエイトのリクエスト取得に失敗しました。0件として扱います"; echo '[]' > data/newcomer_submissions.json; }

          echo "=== 新人リーグを実行 ==="
          python -u run_newcomer_league.py \
            --data-dir data \
            --submissions-path data/newcomer_submissions.json

          echo "=== data/ の中身 ==="
          ls -la data/newcomer_league/ 2>&1 || echo "(newcomer_league/ ディレクトリが存在しません)"

          # newcomer_candidate_pool.jsonは「二重実行スキップ」等の早期returnでは
          # 作られないことがある（実際に初回遭遇でgit add全体が失敗した）ため、
          # 他の任意ファイルと同様に存在しなくても失敗しないようにする
          git add data/newcomer_winners.json data/newcomer_league 2>/dev/null || true
          git add data/newcomer_candidate_pool.json 2>/dev/null || true
          if ! git diff --staged --quiet; then
            git commit -m "Newcomer league results [skip ci]"

            # pushが失敗する主因は、この実行中に本戦（evolve.yml）側がdata/newcomer_winners.jsonを
            # 消費・削除するコミットを先にpushしているケース。単純な「git pull --rebase」だと
            # 「削除 vs 変更」の競合が自動解決できずrebaseごと失敗し、せっかく計算した新人リーグの
            # 結果がpushされずに失われてしまっていた。
            # rebaseで競合解決を試みる代わりに、失敗するたびに最新のoriginへ
            # 「git reset --mixed」でHEAD・indexだけを付け替え（作業ツリーのファイル内容は
            # 変更しない）、今回生成した結果を改めてadd・commitして載せ直す方式にする。
            # これなら「相手が何を変更・削除していたか」を気にせず、常に自分の最新の結果を
            # 最新のoriginの上に積み直すだけで済み、この種の競合が原理的に起こらない
            PUSHED=0
            for attempt in 1 2 3 4; do
              if git push; then
                PUSHED=1
                break
              fi
              echo "::warning::git push 失敗（試行 ${attempt}/4）。最新のmainを取り込んで結果を積み直します"
              retry_cmd git fetch origin main || break
              git reset --mixed origin/main

              # push失敗＝本戦（evolve.yml）側のコミットが先に取り込まれていた可能性が高い。
              # このスクリプトの対局計算中に本戦のバッチがcurrent_seasonを進めてしまうと、
              # 実行開始時点で決めたtarget_season（＝ファイル名）が最新状態とずれたままに
              # なる。ここで最新のcurrent_seasonを元に対象季を再計算し、ズレていれば
              # ファイル名・内容を修正する（既に正しい季の結果があれば二重実行として破棄）
              python -u run_newcomer_league.py --data-dir data --relabel-check

              git add data/newcomer_winners.json data/newcomer_league 2>/dev/null || true
              git add data/newcomer_candidate_pool.json 2>/dev/null || true
              if git diff --staged --quiet; then
                echo "最新のmainに既に同じ内容が反映されていました（他の実行と重複した可能性）"
                PUSHED=1
                break
              fi
              git commit -m "Newcomer league results [skip ci]"
              sleep $((attempt * 3))
            done

            if [ "$PUSHED" != "1" ]; then
              echo "::error::git pushに複数回失敗しました。本戦（evolve.yml）が今夜、新人リーグの勝者を取り込めない可能性があります"
              exit 1
            fi

            # サイト側（新人リーグの結果タブ等）は、これまでevolve.yml実行時の
            # xserverプッシュ型インポートに頼っていたため、evolve.yml側で使っている
            # プル型インポート（GitHubから直接取得）をここでも呼び、本戦の実行を待たずに
            # 新人リーグ結果をサイトへすぐ反映させる。失敗してもジョブは失敗扱いにしない
            # （GitHub上のデータは既にpush済みなので、次のevolve.yml実行時などに
            #  改めて取り込まれる）
            echo "=== サイトへ新人リーグ結果を反映（プル型インポート） ==="
            retry_cmd curl -sS -f --connect-timeout 8 --max-time 20 "$PULL_IMPORT_URL" \
              || echo "::warning::サイトへのプル型インポートに失敗しました。本戦の次回実行時などに改めて反映されます"
          else
            echo "変更なし（コミット不要）"
          fi
